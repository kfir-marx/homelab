---
proxmox_expected_hostname: largegpu

# The ext4 mount remains owned by proxmox_storage. nfs_server adopts the live
# mount only to create and export the opposite-node backup destination.
nfs_server_adopted_mount_points:
  - /mnt/pve/largegpu-hdd
nfs_server_directories:
  - path: /mnt/pve/largegpu-hdd/proxmox-backups/from-smallgpu
    mount_point: /mnt/pve/largegpu-hdd
    owner: root
    group: root
    mode: "0700"
nfs_server_exports:
  - path: /mnt/pve/largegpu-hdd/proxmox-backups/from-smallgpu
    mount_point: /mnt/pve/largegpu-hdd
    client: 192.168.1.106
    options: rw,sync,no_subtree_check,no_root_squash,fsid=21

proxmox_directory_storages:
  - id: largegpu-hdd
    uuid: 84e5ba00-6169-4082-b453-ec93f693f167
    filesystem: ext4
    mount_point: /mnt/pve/largegpu-hdd
    mount_options: defaults
    content:
      - backup
      - iso
      - vztmpl
      - images
    nodes:
      - largegpu

# The backing export is owned by smallgpu's nfs_server role. This declaration
# fixes the stale Proxmox path (/mnt/storage1-bulk) so clients remount the live
# /mnt/data10tb export after reboot.
proxmox_nfs_storages:
  - id: storage1-bulk
    server: 192.168.1.106
    export: /mnt/data10tb
    options: vers=4.2
    content:
      - backup
      - iso
      - vztmpl
    nodes:
      - largegpu
  - id: backup-on-largegpu
    server: 192.168.1.107
    export: /mnt/pve/largegpu-hdd/proxmox-backups/from-smallgpu
    options: vers=4.2
    content:
      - backup
    nodes:
      - smallgpu
  - id: backup-on-smallgpu
    server: 192.168.1.106
    export: /mnt/data10tb/proxmox-backups/from-largegpu
    options: vers=4.2
    content:
      - backup
    nodes:
      - largegpu

# These assets are independent of the Terraform-managed, per-node Talos images.
# The role copies, verifies SHA-256, and only then removes the NVMe source.
proxmox_iso_relocations:
  - source: /var/lib/vz/template/iso/Win11_25H2_EnglishInternational_x64_v2.iso
    destination: /mnt/pve/largegpu-hdd/template/iso/Win11_25H2_EnglishInternational_x64_v2.iso
    remove_source: true
  - source: /var/lib/vz/template/iso/virtio-win.iso
    destination: /mnt/pve/largegpu-hdd/template/iso/virtio-win.iso
    remove_source: true

# VM 502 is the durable standalone Windows guest. Its dedicated nightly job has
# a GPU mutex hook because Proxmox briefly starts QEMU when backing up a stopped
# passthrough VM. The general job excludes 502 to avoid duplicate archives.
proxmox_backup_jobs:
  - id: largegpu-windows-502
    vmid: 502
    storage: backup-on-smallgpu
    node: largegpu
    schedule: "04:15"
    mode: snapshot
    compress: zstd
    keep_last: 2
    script: /usr/local/sbin/vzdump-gpu-mutex-hook
    enabled: true
  - id: smallgpu-cross-node
    all: true
    exclude:
      - 990
    storage: backup-on-largegpu
    node: smallgpu
    schedule: "02:15"
    mode: snapshot
    compress: zstd
    keep_last: 3
    keep_weekly: 2
    enabled: true
  - id: largegpu-cross-node
    all: true
    exclude:
      - 502
    storage: backup-on-smallgpu
    node: largegpu
    schedule: "07:00"
    mode: snapshot
    compress: zstd
    keep_last: 3
    keep_weekly: 2
    enabled: true

proxmox_backup_retired_job_ids:
  - personal-workstation
  - largegpu-windows-template

proxmox_backup_gpu_mutex_hook_enabled: true
proxmox_backup_gpu_mutex_source_vmid: 502
proxmox_backup_gpu_mutex_conflicting_vmids:
  - 402
proxmox_backup_gpu_mutex_shutdown_timeout_seconds: 600

# The independently generated public key is supplied through the controller
# environment; only ubuntu-workstation's management IP may use it.
homelab_vm_actuator_enabled: true
homelab_vm_actuator_management_source: 192.168.1.105

# Planned NUT configuration: add this host to nut_servers only after its UPS
# arrives, connect the USB data cable, and replace both empty values with the
# four-digit lowercase IDs reported by `lsusb`.
nut_ups_usb_vendorid: ""
nut_ups_usb_productid: ""

vfio_passthrough_bootloader: grub
vfio_passthrough_iommu_parameters:
  - amd_iommu=on
  - iommu=pt
vfio_passthrough_iommu_group: 21
# Read from the live host on 2026-07-22 before being declared here.
vfio_passthrough_devices:
  - address: "08:00.0"
    id: 10de:2216
  - address: "08:00.1"
    id: 10de:1aef
vfio_passthrough_expected_group_members:
  - address: "08:00.0"
    id: 10de:2216
  - address: "08:00.1"
    id: 10de:1aef
