---
# This is the permanent laptop that previously ran Proxmox as
# gpunvdgtx1060. Ubuntu now runs directly on the hardware.
ansible_become_exe: /usr/bin/sudo.ws

workstation_expected_hostname: kfir-Predator-PH315-51

nfs_server_mounts:
  - name: storage2-bulk
    uuid: 07445d19-37d4-4353-af1a-9511fb9c74e9
    mount_point: /mnt/storage2-bulk
    filesystem: ext4
    mount_options: defaults,nofail
    dump: 0
    passno: 2
nfs_server_directories:
  - path: /mnt/storage2-bulk/media
    mount_point: /mnt/storage2-bulk
    owner: root
    group: root
    mode: "0700"
  - path: /mnt/storage2-bulk/media/backups
    mount_point: /mnt/storage2-bulk
    owner: root
    group: root
    mode: "0700"
  - path: /mnt/storage2-bulk/homelab-assistant/postgres
    mount_point: /mnt/storage2-bulk
    owner: "999"
    group: "999"
    mode: "0700"
  # Bridge state and legacy sessions.db remain local rollback artifacts.
  - path: /mnt/storage2-bulk/homelab-assistant/sessions
    mount_point: /mnt/storage2-bulk
    owner: "10001"
    group: "10001"
    mode: "0700"
  - path: /mnt/storage2-bulk/external-ai/postgres
    mount_point: /mnt/storage2-bulk
    owner: "999"
    group: "999"
    mode: "0700"
  - path: /mnt/storage2-bulk/external-ai/codex-home
    mount_point: /mnt/storage2-bulk
    owner: "10001"
    group: "10001"
    mode: "0700"
nfs_server_exports:
  - path: /mnt/storage2-bulk
    client: 192.168.1.0/24
    options: rw,sync,no_subtree_check,no_root_squash,fsid=10

homelab_assistant_enabled: true
homelab_assistant_image: ghcr.io/kfir-marx/homelab-assistant:sha-b9f258738ed1709e71a2dff57563cc0675bc0c8a
