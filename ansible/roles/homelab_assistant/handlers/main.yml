---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart homelab Codex app server
  ansible.builtin.systemd_service:
    name: homelab-codex-app-server.service
    state: restarted

- name: Restart homelab assistant
  ansible.builtin.systemd_service:
    name: homelab-assistant.service
    state: restarted
