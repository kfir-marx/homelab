---
proxmox_restore_confirm: false
proxmox_native_restore_start: false
proxmox_native_restore_backup_storage_by_node:
  smallgpu: backup-on-largegpu
  largegpu: backup-on-smallgpu

proxmox_native_restore_vm_ids_by_node:
  smallgpu:
    - 202
    - 403
  largegpu:
    - 201
    - 402
    - 502

proxmox_native_restore_target_storage_by_vm:
  201: largegpu-hdd
  202: local-lvm
  402: largegpu-hdd
  403: local-lvm
  502: local-lvm

# Never start both RTX 3080 consumers during an unattended node restore.
proxmox_native_restore_start_vm_ids_by_node:
  smallgpu:
    - 202
    - 403
  largegpu:
    - 201

proxmox_native_restore_expected_ips:
  201: 192.168.1.211
  202: 192.168.1.212
  402: 192.168.1.232
  403: 192.168.1.233

proxmox_native_restore_expected_hostpci:
  502: "08:00"
  403: "09:00"
