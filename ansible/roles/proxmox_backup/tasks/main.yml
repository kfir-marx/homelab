---
- name: Validate Proxmox backup job declarations
  ansible.builtin.assert:
    that:
      - item.id is match('^[a-zA-Z0-9_-]+$')
      - >-
        (item.all | default(false) | bool)
        or (item.vmid | default('') | string is match('^[1-9][0-9]*(,[1-9][0-9]*)*$'))
      - not (item.all | default(false) | bool) or item.vmid is not defined
      - >-
        item.exclude | default([]) | map('string')
        | reject('match', '^[1-9][0-9]*$') | list | length == 0
      - item.exclude | default([]) | length == 0 or item.all | default(false) | bool
      - item.storage is match('^[a-zA-Z][a-zA-Z0-9_-]+$')
      - item.node is match('^[a-zA-Z][a-zA-Z0-9_-]+$')
      - item.mode in ['snapshot', 'stop', 'suspend']
      - item.compress in ['zstd', 'gzip', 'lzo', '0']
      - item.keep_last | int > 0
      - item.keep_weekly | default(0) | int >= 0
      - >-
        item.script | default('') | length == 0
        or item.script is match('^/[a-zA-Z0-9_./-]+$')
    fail_msg: "Invalid Proxmox backup job declaration: {{ item }}"
  loop: "{{ proxmox_backup_jobs }}"
  loop_control:
    label: "{{ item.id | default('unnamed') }}"

- name: Validate GPU mutex backup hook configuration
  ansible.builtin.assert:
    that:
      - proxmox_backup_gpu_mutex_hook_path is match('^/[a-zA-Z0-9_./-]+$')
      - proxmox_backup_gpu_mutex_source_vmid | int >= 100
      - proxmox_backup_gpu_mutex_shutdown_timeout_seconds | int >= 60
      - >-
        proxmox_backup_gpu_mutex_conflicting_vmids | map('int')
        | select('equalto', proxmox_backup_gpu_mutex_source_vmid | int)
        | list | length == 0
      - >-
        proxmox_backup_gpu_mutex_conflicting_vmids | map('string')
        | reject('match', '^[1-9][0-9]*$') | list | length == 0
    fail_msg: "Invalid GPU mutex backup hook declaration."
  when: proxmox_backup_gpu_mutex_hook_enabled | bool

- name: Install GPU mutex backup hook
  ansible.builtin.template:
    src: vzdump-gpu-mutex-hook.sh.j2
    dest: "{{ proxmox_backup_gpu_mutex_hook_path }}"
    owner: root
    group: root
    mode: "0750"
  when: proxmox_backup_gpu_mutex_hook_enabled | bool

- name: Read backup target status
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ item.node }}/storage/{{ item.storage }}/status"
      - --output-format
      - json
  register: proxmox_backup_target_status
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_backup_jobs }}"
  loop_control:
    label: "{{ item.node }}/{{ item.storage }}"

- name: Require active backup-capable target storage
  ansible.builtin.assert:
    that:
      - target_status.active | int == 1
      - target_status.enabled | int == 1
      - "'backup' in target_status.content.split(',')"
    fail_msg: >-
      {{ item.item.storage }} is not active and backup-capable on
      {{ item.item.node }}.
  vars:
    target_status: "{{ item.stdout | from_json }}"
  loop: "{{ proxmox_backup_target_status.results }}"
  loop_control:
    label: "{{ item.item.node }}/{{ item.item.storage }}"

- name: Require declared backup guests on their target nodes
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/nodes/{{ item.node }}/qemu/{{ item.vmid }}/status/current"
      - --output-format
      - json
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_backup_jobs }}"
  loop_control:
    label: "{{ item.node }}/{{ item.vmid | default('all') }}"
  when: not (item.all | default(false) | bool)

- name: Validate retired backup job identifiers
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9_-]+$')
    fail_msg: "Invalid retired Proxmox backup job ID: {{ item }}"
  loop: "{{ proxmox_backup_retired_job_ids }}"

- name: Read retired Proxmox backup jobs
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/cluster/backup/{{ item }}"
      - --output-format
      - json
  register: proxmox_backup_retired_job_reads
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ proxmox_backup_retired_job_ids }}"

- name: Remove only explicitly retired Proxmox backup jobs
  ansible.builtin.command:
    argv:
      - pvesh
      - delete
      - "/cluster/backup/{{ item.item }}"
  when:
    - item.rc == 0
    - not ansible_check_mode
  changed_when: true
  loop: "{{ proxmox_backup_retired_job_reads.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Manage each Proxmox backup job
  ansible.builtin.include_tasks: manage_job.yml
  loop: "{{ proxmox_backup_jobs }}"
  loop_control:
    loop_var: proxmox_backup_job
    label: "{{ proxmox_backup_job.id }}"
