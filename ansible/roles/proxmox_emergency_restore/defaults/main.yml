---
proxmox_emergency_restore_source: 192.168.1.105:/mnt/storage2-bulk
proxmox_emergency_restore_mount_point: /mnt/proxmox-recovery-smallgpu
# Preserve the live emergency directory spelling. The source export contains
# the accepted recovery images under "recovary"; do not rename or move them.
proxmox_emergency_restore_directory: proxmox-recovary-smallgpu
proxmox_emergency_restore_storage: local-lvm

# The control plane now lives on largegpu; this retired-image workflow restores
# only smallgpu's mixed worker.
proxmox_emergency_restore_vm_ids:
  - 403

proxmox_emergency_restore_vms:
  403:
    name: gpu-3
    machine: q35
    bios: ovmf
    cores: 10
    memory_mb: 12288
    ip_address: 192.168.1.233/24
    gateway: 192.168.1.1
    bridge: vmbr0
    cloud_init: true
    fresh_efi: true
    hostpci0: host=09:00,pcie=1,rombar=1,x-vga=0
    disks:
      - interface: scsi0
        image: vm-403-disk-1.qcow2
        options: aio=io_uring,backup=1,cache=none,discard=on,iothread=0,replicate=1,ssd=1
      - interface: scsi1
        image: vm-403-disk-2.qcow2
        options: aio=io_uring,backup=1,cache=none,discard=on,iothread=1,replicate=0,serial=media-state,ssd=1
