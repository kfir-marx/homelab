---
- name: Configure the Ubuntu NFS workstation
  hosts: ubuntu_workstations
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require the declared Ubuntu workstation
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_hostname == workstation_expected_hostname
        fail_msg: >-
          Refusing to configure {{ inventory_hostname }}: expected Ubuntu host
          {{ workstation_expected_hostname }}, found {{ ansible_distribution }}
          {{ ansible_hostname }}.

    - name: Install workstation NFS packages
      ansible.builtin.apt:
        name:
          - nfs-common
          - nfs-kernel-server
        state: present
        update_cache: true

    - name: Remove retired Talos virtualization packages
      ansible.builtin.apt:
        name:
          - bridge-utils
          - genisoimage
          - libvirt-clients
          - libvirt-daemon-system
          - ovmf
          - qemu-system-x86
          - qemu-utils
          - virt-manager
        state: absent

    - name: Remove retired workstation VFIO boot configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/modules-load.d/homelab-vfio.conf
        - /etc/modprobe.d/homelab-vfio.conf
        - /etc/modprobe.d/homelab-gpu-blacklist.conf
        - /etc/default/grub.d/99-homelab-vfio.cfg
      register: workstation_vfio_cleanup
      notify:
        - Rebuild workstation initramfs
        - Update workstation GRUB

  roles:
    - role: nfs_server
      tags:
        - nfs

  post_tasks:
    - name: Report whether a reboot is required to return NVIDIA to Ubuntu
      ansible.builtin.debug:
        msg: >-
          {{ 'The retired VFIO configuration was removed. Reboot the workstation so the NVIDIA driver can reclaim the GTX 1060 and HDMI port.'
             if (workstation_vfio_cleanup is changed)
             else 'No retired VFIO files remain. If the GTX 1060 still uses vfio-pci, reboot once before troubleshooting the NVIDIA driver.' }}

  handlers:
    - name: Rebuild workstation initramfs
      ansible.builtin.command: update-initramfs -u -k all
      changed_when: true

    - name: Update workstation GRUB
      ansible.builtin.command: update-grub
      changed_when: true
