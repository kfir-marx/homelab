---
- name: Verify Proxmox host configuration without changing it
  hosts: proxmox_hosts
  gather_facts: true
  serial: 1

  roles:
    - role: proxmox_preflight

  tasks:
    - name: Verify Proxmox guest shutdown orchestration is enabled
      ansible.builtin.command: systemctl is-enabled pve-guests.service
      register: verified_pve_guests_enabled
      changed_when: false
      check_mode: false
      when: inventory_hostname in groups.get('nut_servers', [])
      tags:
        - nut

    - name: Require Proxmox guest shutdown orchestration
      ansible.builtin.assert:
        that:
          - verified_pve_guests_enabled.stdout == 'enabled'
        fail_msg: >-
          pve-guests.service is not enabled; a host poweroff may not gracefully
          stop its guests.
      when: inventory_hostname in groups.get('nut_servers', [])
      tags:
        - nut

    - name: Read NUT service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - nut-server.service
          - nut-monitor.service
      register: verified_nut_services
      changed_when: false
      check_mode: false
      failed_when: false
      when: inventory_hostname in groups.get('nut_servers', [])
      tags:
        - nut

    - name: Read live UPS status from NUT
      ansible.builtin.command:
        argv:
          - upsc
          - "{{ nut_ups_name | default('ups') }}@localhost"
          - ups.status
      register: verified_nut_ups_status
      changed_when: false
      check_mode: false
      failed_when: false
      when: inventory_hostname in groups.get('nut_servers', [])
      tags:
        - nut

    - name: Require a responsive online or on-battery UPS
      ansible.builtin.assert:
        that:
          - verified_nut_services.stdout_lines | first == 'active'
          - >-
            ((nut_automatic_shutdown_enabled | default(true)) | bool
             and verified_nut_services.stdout_lines | last == 'active')
            or
            (not ((nut_automatic_shutdown_enabled | default(true)) | bool)
             and verified_nut_services.stdout_lines | last != 'active')
          - verified_nut_ups_status.stdout is search('(^| )(OL|OB)( |$)')
        fail_msg: >-
          NUT is not healthy: service states={{ verified_nut_services.stdout_lines }},
          UPS status={{ verified_nut_ups_status.stdout | default('unavailable') }}.
      when: inventory_hostname in groups.get('nut_servers', [])
      tags:
        - nut

    - name: Read active NFS exports
      ansible.builtin.command: exportfs -v
      register: active_nfs_exports
      changed_when: false
      check_mode: false
      when: inventory_hostname in groups.get('nfs_servers', [])
      tags:
        - nfs

    - name: Verify declared NFS exports are active
      ansible.builtin.assert:
        that:
          - item.path in active_nfs_exports.stdout
          - item.client in active_nfs_exports.stdout
        fail_msg: "NFS export {{ item.path }} for {{ item.client }} is not active"
      loop: "{{ nfs_server_exports | default([]) }}"
      when: inventory_hostname in groups.get('nfs_servers', [])
      tags:
        - nfs

    - name: Read current VFIO device bindings
      ansible.builtin.shell: |
        set -o pipefail
        for address in {% for device in vfio_passthrough_devices %}{{ device.address | quote }} {% endfor %}; do
          device_path="/sys/bus/pci/devices/0000:${address}"
          if [ -L "${device_path}/driver" ]; then
            driver="$(basename "$(readlink -f "${device_path}/driver")")"
          else
            driver=unbound
          fi
          printf '%s=%s\n' "${address}" "${driver}"
        done
      args:
        executable: /bin/bash
      register: verified_vfio_bindings
      changed_when: false
      check_mode: false
      when: inventory_hostname in groups.get('vfio_hosts', [])
      tags:
        - vfio

    - name: Show current VFIO device bindings
      ansible.builtin.debug:
        var: verified_vfio_bindings.stdout_lines
      when: inventory_hostname in groups.get('vfio_hosts', [])
      tags:
        - vfio

    - name: Require every passthrough device to use vfio-pci
      ansible.builtin.assert:
        that:
          - (item.address ~ '=vfio-pci') in verified_vfio_bindings.stdout_lines
        fail_msg: >-
          {{ item.address }} is not bound to vfio-pci. Run the VFIO role, arrange
          workload downtime, explicitly reboot the host, and verify again.
      loop: "{{ vfio_passthrough_devices | default([]) }}"
      loop_control:
        label: "{{ item.address }}"
      when: inventory_hostname in groups.get('vfio_hosts', [])
      tags:
        - vfio

    - name: Check expected VFIO group device
      ansible.builtin.stat:
        path: "/dev/vfio/{{ vfio_passthrough_iommu_group }}"
      register: verified_vfio_group_device
      when: inventory_hostname in groups.get('vfio_hosts', [])
      tags:
        - vfio

    - name: Require expected VFIO group device
      ansible.builtin.assert:
        that:
          - verified_vfio_group_device.stat.exists
          - verified_vfio_group_device.stat.ischr | default(false)
        fail_msg: >-
          /dev/vfio/{{ vfio_passthrough_iommu_group }} is absent; the declared
          group is not ready for passthrough.
      when: inventory_hostname in groups.get('vfio_hosts', [])
      tags:
        - vfio

    - name: Read managed directory storage mounts
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --output
          - UUID,FSTYPE,TARGET,OPTIONS
          - --target
          - "{{ item.mount_point }}"
      register: verified_directory_storage_mounts
      changed_when: false
      check_mode: false
      loop: "{{ proxmox_directory_storages | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Require managed directory storages to be mounted read/write
      ansible.builtin.assert:
        that:
          - item.item.uuid in item.stdout
          - item.item.filesystem in item.stdout
          - item.item.mount_point in item.stdout
          - item.stdout is search('(^|[, ])rw([, ]|$)')
        fail_msg: "Directory storage {{ item.item.id }} is not mounted as declared."
      loop: "{{ verified_directory_storage_mounts.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Read managed Proxmox directory storage registrations
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/storage/{{ item.id }}"
          - --output-format
          - json
      register: verified_directory_storage_registrations
      changed_when: false
      check_mode: false
      loop: "{{ proxmox_directory_storages | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Require Proxmox directory storage registrations
      ansible.builtin.assert:
        that:
          - registration.type == 'dir'
          - registration.path == item.item.mount_point
          - registration.is_mountpoint | string == '1'
          - (registration.content.split(',') | sort) == (item.item.content | sort)
          - (registration.nodes.split(',') | sort) == (item.item.nodes | sort)
        fail_msg: "Proxmox storage {{ item.item.id }} does not match inventory."
      vars:
        registration: "{{ item.stdout | from_json }}"
      loop: "{{ verified_directory_storage_registrations.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Read managed Proxmox NFS storage registrations
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/storage/{{ item.id }}"
          - --output-format
          - json
      register: verified_nfs_storage_registrations
      changed_when: false
      check_mode: false
      loop: "{{ proxmox_nfs_storages | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Require Proxmox NFS storage registrations
      ansible.builtin.assert:
        that:
          - registration.type == 'nfs'
          - registration.server == item.item.server
          - registration.export == item.item.export
          - registration.get('options', '') ==
            (item.item.options | default('vers=4.2'))
          - (registration.content.split(',') | sort) == (item.item.content | sort)
          - >-
            (registration.get('nodes', '').split(',')
             | reject('equalto', '') | sort | list)
            == (item.item.nodes | sort)
        fail_msg: "Proxmox NFS storage {{ item.item.id }} does not match inventory."
      vars:
        registration: "{{ item.stdout | from_json }}"
      loop: "{{ verified_nfs_storage_registrations.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Verify relocated ISO destinations
      ansible.builtin.stat:
        path: "{{ item.destination }}"
      register: verified_relocated_isos
      loop: "{{ proxmox_iso_relocations | default([]) }}"
      loop_control:
        label: "{{ item.destination }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Require relocated ISO destinations
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Relocated ISO {{ item.item.destination }} is absent."
      loop: "{{ verified_relocated_isos.results | default([]) }}"
      loop_control:
        label: "{{ item.item.destination }}"
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage

    - name: Read managed Proxmox backup jobs
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/cluster/backup/{{ item.id }}"
          - --output-format
          - json
      register: verified_proxmox_backup_jobs
      changed_when: false
      check_mode: false
      loop: "{{ proxmox_backup_jobs | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: inventory_hostname in groups.get('backup_hosts', [])
      tags:
        - backup

    - name: Read all Proxmox backup jobs for power-state safety
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - /cluster/backup
          - --output-format
          - json
      register: verified_all_proxmox_backup_jobs
      changed_when: false
      check_mode: false
      when: inventory_hostname in groups.get('backup_hosts', [])
      tags:
        - backup

    - name: Require snapshot-only hook-free Proxmox backup jobs
      ansible.builtin.assert:
        that:
          - >-
            backup_jobs | rejectattr('mode', 'equalto', 'snapshot')
            | list | length == 0
          - >-
            backup_jobs | selectattr('script', 'defined')
            | rejectattr('script', 'equalto', '') | list | length == 0
        fail_msg: >-
          Every Proxmox backup job must use snapshot mode without a hook so
          backup automation cannot change VM power state.
      vars:
        backup_jobs: "{{ verified_all_proxmox_backup_jobs.stdout | from_json }}"
      when: inventory_hostname in groups.get('backup_hosts', [])
      tags:
        - backup

    - name: Inspect retired GPU mutex backup hook
      ansible.builtin.stat:
        path: /usr/local/sbin/vzdump-gpu-mutex-hook
      register: verified_retired_gpu_mutex_backup_hook
      when: inventory_hostname in groups.get('backup_hosts', [])
      tags:
        - backup

    - name: Require retired GPU mutex backup hook to be absent
      ansible.builtin.assert:
        that:
          - not verified_retired_gpu_mutex_backup_hook.stat.exists
        fail_msg: >-
          Retired backup helper /usr/local/sbin/vzdump-gpu-mutex-hook still
          exists and must be removed.
      when: inventory_hostname in groups.get('backup_hosts', [])
      tags:
        - backup

    - name: Require managed Proxmox backup job definitions
      ansible.builtin.assert:
        that:
          - >-
            backup_job.get('all', 0) | int
            == (item.item.all | default(false) | bool) | int
          - >-
            (item.item.all | default(false) | bool)
            or backup_job.get('vmid', '') | string == item.item.vmid | string
          - >-
            (backup_job.get('exclude', '').split(',')
             | reject('equalto', '') | sort | list)
            == (item.item.exclude | default([]) | map('string') | sort | list)
          - backup_job.storage == item.item.storage
          - backup_job.node == item.item.node
          - backup_job.schedule == item.item.schedule
          - backup_job.mode == item.item.mode
          - backup_job.compress | string == item.item.compress | string
          - >-
            backup_job.get('script', '')
            == item.item.script | default('')
          - backup_job.get('enabled', 1) | int ==
            (item.item.enabled | default(true) | bool) | int
          - >-
            (
              backup_job.get('prune-backups', {}).get('keep-last', '')
              if backup_job.get('prune-backups', {}) is mapping
              else (
                backup_job.get('prune-backups', '')
                | regex_search('(?:^|,)keep-last=([^,]+)', '\\1')
                | default(['0'], true) | first
              )
            ) | int == item.item.keep_last | int
          - >-
            (
              backup_job.get('prune-backups', {}).get('keep-weekly', 0)
              if backup_job.get('prune-backups', {}) is mapping
              else (
                backup_job.get('prune-backups', '')
                | regex_search('(?:^|,)keep-weekly=([^,]+)', '\\1')
                | default(['0'], true) | first
              )
            ) | int == item.item.keep_weekly | default(0) | int
        fail_msg: "Backup job {{ item.item.id }} does not match inventory."
      vars:
        backup_job: "{{ item.stdout | from_json }}"
      loop: "{{ verified_proxmox_backup_jobs.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"
      when: inventory_hostname in groups.get('backup_hosts', [])
      tags:
        - backup
