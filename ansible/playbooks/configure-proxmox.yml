---
- name: Configure joined Proxmox cluster hosts
  hosts: proxmox_hosts
  gather_facts: true
  serial: 1

  roles:
    - role: proxmox_preflight
    - role: proxmox_repositories
      tags:
        - repositories
    - role: proxmox_base
      tags:
        - packages
    - role: nfs_server
      when: inventory_hostname in groups.get('nfs_servers', [])
      tags:
        - nfs
    - role: proxmox_storage
      when: inventory_hostname in groups.get('local_storage_hosts', [])
      tags:
        - storage
    - role: proxmox_backup
      when: inventory_hostname in groups.get('backup_hosts', [])
      tags:
        - backup
    - role: proxmox_windows_template_refresh
      when: proxmox_windows_template_refresh_enabled | default(false) | bool
      tags:
        - windows-template-refresh
    - role: nut_server
      when: inventory_hostname in groups.get('nut_servers', [])
      tags:
        - nut
    - role: vfio_passthrough
      when: inventory_hostname in groups.get('vfio_hosts', [])
      tags:
        - vfio

  post_tasks:
    - name: Report hosts that still require a reboot for VFIO
      ansible.builtin.debug:
        msg: >-
          {{ 'Check mode predicts VFIO configuration changes' if ansible_check_mode
             else 'VFIO configuration is staged or a declared device is not bound to vfio-pci' }}.
          Use playbooks/reboot-proxmox.yml only after workload shutdown and
          explicit approval.
      when: vfio_passthrough_reboot_required | default(false) | bool
      tags:
        - vfio
