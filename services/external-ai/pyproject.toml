[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "homelab-external-ai"
version = "0.2.0"
description = "Durable and RabbitMQ broker for Codex and Alibaba Model Studio"
requires-python = ">=3.14.7"
dependencies = [
  "aio-pika>=10.0.1,<11",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "prometheus-client>=0.26.0,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "SQLAlchemy>=2.0.52,<3",
  "typer>=0.27.2,<1",
  "uvicorn>=0.52.4,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.5,<1",
]

[project.scripts]
external-ai = "external_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/external_ai"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
