[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "tapy"
version = "1.0.0"
description = "Multi-tenant travel bookings, opportunities, recipients, delivery, and ingestion"
requires-python = ">=3.14.7"
dependencies = [
  "alembic>=1.16.5,<2",
  "aio-pika>=10.0.1,<11",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.141.1,<1",
  "email-validator>=2.3.0,<3",
  "httpx>=0.28.1,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "SQLAlchemy>=2.0.52,<3",
  "structlog>=26.1.0,<27",
  "typer>=0.27.2,<1",
  "uvicorn>=0.52.4,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "respx>=0.23.1,<1",
  "ruff>=0.16.5,<1",
]

[project.scripts]
tapy = "tapy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tapy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
