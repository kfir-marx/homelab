[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "homelab-internal-llm"
version = "0.1.0"
description = "Authenticated RabbitMQ-backed gateway for the homelab vLLM service"
requires-python = ">=3.14.7"
dependencies = [
  "aio-pika>=9.5.8,<10",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "prometheus-client>=0.26.0,<1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.15.0,<3",
  "typer>=0.27.1,<1",
  "uvicorn>=0.52.0,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.4,<1",
]

[project.scripts]
internal-llm = "internal_llm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/internal_llm"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
