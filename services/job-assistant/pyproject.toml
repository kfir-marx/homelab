[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "homelab-job-assistant"
version = "0.1.0"
description = "Personal, human-approved job discovery and application assistance"
requires-python = ">=3.14.7"
dependencies = [
  "alembic>=1.19.1,<2",
  "beautifulsoup4>=4.15.0,<5",
  "bleach>=6.4.0,<7",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "prometheus-client>=0.26.0,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.15.0,<3",
  "python-docx>=1.2.0,<2",
  "python-multipart>=0.0.32,<1",
  "PyYAML>=6.0.3,<7",
  "reportlab>=5.0.0,<6",
  "SQLAlchemy>=2.0.52,<3",
  "structlog>=26.1.0,<27",
  "tenacity>=9.1.4,<10",
  "typer>=0.27.1,<1",
  "uvicorn>=0.52.4,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-postgresql>=8.1.0,<9",
  "respx>=0.23.1,<1",
  "ruff>=0.16.3,<1",
  "types-PyYAML>=6.0.12.20260815,<7",
  "types-bleach>=6.4.0.20260728,<7",
  "types-reportlab>=4.5.1.20260807,<5",
]

[project.scripts]
job-assistant = "job_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_assistant"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = ["integration: requires a local PostgreSQL server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
