[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "homelab-job-assistant"
version = "0.1.0"
description = "Personal, human-approved job discovery and application assistance"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5",
  "bleach>=6.2,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
  "SQLAlchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.20.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-postgresql>=6.1,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
  "types-bleach>=6.2,<7",
  "types-reportlab>=4.2,<5",
]

[project.scripts]
job-assistant = "job_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/job_assistant"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = ["integration: requires a local PostgreSQL server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
