[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "homelab-assistant"
version = "0.1.0"
description = "Private Telegram client for the workstation Codex App Server"
requires-python = ">=3.14.6"
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.15.0,<3",
  "psycopg[binary]>=3.3.4,<4",
  "SQLAlchemy>=2.0.52,<3",
  "websockets>=16.0,<17",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "respx>=0.23.1,<1",
  "ruff>=0.16.3,<1",
]

[project.scripts]
homelab-assistant = "homelab_assistant.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_assistant"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
