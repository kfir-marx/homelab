# Kernel networking mode gives the subnet router a real tailscale0 interface
# and avoids the userspace netstack's L4 proxying overhead. Talos 1.13's
# container runtime exposes a mounted /dev/net/tun without the legacy generic
# device plugin. NET_ADMIN is scoped to this container's network namespace.
#
# Single replica only — this Deployment uses one persistent node identity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-router
  namespace: tailscale-router
  labels:
    app: tailscale-router
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two tailscaled instances with the
    # same auth key + hostname race for the same node identity.
    type: Recreate
  selector:
    matchLabels:
      app: tailscale-router
  template:
    metadata:
      labels:
        app: tailscale-router
    spec:
      serviceAccountName: tailscale-router
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.74.1
          imagePullPolicy: IfNotPresent
          env:
            # Store tailscaled state in this Secret instead of /var/lib.
            # tailscaled creates + manages the Secret itself.
            - name: TS_KUBE_SECRET
              value: tailscale-router-state-official
            - name: TS_USERSPACE
              value: "false"
            # Keep the WireGuard listener aligned with the NetworkPolicy.
            # tailscaled otherwise selects a random port at each fresh start.
            - name: TS_TAILSCALED_EXTRA_ARGS
              value: --port=41641
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_ROUTES
              value: 192.168.1.0/24
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
            # Tagged auth key created in the official Tailscale admin console.
            # See docs/tailscale-runbook.md.
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_EXTRA_ARGS
              value: >-
                --advertise-tags=tag:router
                --hostname=k8s-router
                --accept-dns=false
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
