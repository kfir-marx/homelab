apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-flight-matcher
  namespace: homelab-assistant
data:
  GOOGLE_OAUTH_CLIENT_ID: REPLACE_WITH_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com
  MICROSOFT_OAUTH_CLIENT_ID: REPLACE_WITH_MICROSOFT_APPLICATION_CLIENT_ID
  PUBLIC_BASE_URL: https://staymatch.547600.xyz
  LLM_ORDER: internal-llm,external-ai
  INTERNAL_LLM_MODEL: local-llm
  EXTERNAL_AI_MODEL: alibaba:qwen-plus
  MATCH_THRESHOLD: "0.90"
  MAXIMUM_MESSAGES_PER_SCAN: "20"
  GMAIL_QUERY: newer_than:365d
  flights.json: |
    {
      "version": 1,
      "flights": [
        {
          "id": "poc-london-2026-10",
          "label": "London trip, October 2026",
          "arrival_date": "2026-10-12",
          "departure_date": "2026-10-17",
          "destination": {
            "city": "London",
            "country": "United Kingdom",
            "airport_codes": ["LHR", "LGW", "LCY", "STN", "LTN"],
            "aliases": ["London", "Greater London", "UK", "England"]
          }
        }
      ]
    }
