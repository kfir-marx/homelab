apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-flight-matcher
  namespace: homelab-assistant
data:
  # Replace this after the Chrome Web Store assigns the stable extension ID and
  # the matching "Chrome Extension" OAuth client is created in Google Cloud.
  GOOGLE_OAUTH_CLIENT_ID: REPLACE_WITH_CHROME_EXTENSION_CLIENT_ID.apps.googleusercontent.com
  flights.json: |
    {
      "version": 1,
      "flights": [
        {
          "id": "poc-london-2026-10",
          "label": "London trip, October 2026",
          "arrival_date": "2026-10-12",
          "departure_date": "2026-10-17",
          "destination": {
            "city": "London",
            "country": "United Kingdom",
            "airport_codes": ["LHR", "LGW", "LCY", "STN", "LTN"],
            "aliases": ["London", "Greater London", "UK", "England"]
          }
        }
      ]
    }
