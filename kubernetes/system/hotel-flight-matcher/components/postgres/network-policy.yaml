apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hotel-flight-matcher-postgres
spec:
  podSelector:
    matchLabels: {app: hotel-flight-matcher, component: postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: hotel-flight-matcher, component: api}
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hotel-flight-matcher-to-postgres
spec:
  podSelector:
    matchLabels: {app: hotel-flight-matcher, component: api}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: hotel-flight-matcher, component: postgres}
      ports: [{port: 5432, protocol: TCP}]
