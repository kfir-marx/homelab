apiVersion: v1
kind: Service
metadata:
  name: hotel-flight-matcher
  namespace: homelab-assistant
  labels:
    app: hotel-flight-matcher
    component: api
spec:
  type: ClusterIP
  selector:
    app: hotel-flight-matcher
    component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-flight-matcher
  namespace: homelab-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-flight-matcher
      component: api
  template:
    metadata:
      labels:
        app: hotel-flight-matcher
        component: api
    spec:
      priorityClassName: homelab-hotel-flight-matcher
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kfir-marx/hotel-flight-matcher:sha-85301e05cc7554b2118d174a07ac6801c542109f
          imagePullPolicy: IfNotPresent
          env:
            - name: MATCHER_GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: GOOGLE_OAUTH_CLIENT_ID
            - name: MATCHER_MICROSOFT_OAUTH_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: MICROSOFT_OAUTH_CLIENT_ID
            - name: MATCHER_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: PUBLIC_BASE_URL
            - name: MATCHER_LLM_ORDER
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: LLM_ORDER
            - name: MATCHER_INTERNAL_LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: INTERNAL_LLM_MODEL
            - name: MATCHER_EXTERNAL_AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: EXTERNAL_AI_MODEL
            - name: MATCHER_MATCH_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: MATCH_THRESHOLD
            - name: MATCHER_MAXIMUM_MESSAGES_PER_SCAN
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: MAXIMUM_MESSAGES_PER_SCAN
            - name: MATCHER_GMAIL_QUERY
              valueFrom:
                configMapKeyRef:
                  name: hotel-flight-matcher
                  key: GMAIL_QUERY
            - name: MATCHER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hotel-flight-matcher-secrets
                  key: DATABASE_URL
            - name: MATCHER_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: RABBITMQ_URL
            - name: MATCHER_OAUTH_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hotel-flight-matcher-secrets
                  key: OAUTH_TOKEN_ENCRYPTION_KEY
            - name: MATCHER_GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hotel-flight-matcher-secrets
                  key: GOOGLE_OAUTH_CLIENT_SECRET
            - name: MATCHER_MICROSOFT_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hotel-flight-matcher-secrets
                  key: MICROSOFT_OAUTH_CLIENT_SECRET
            - name: MATCHER_FLIGHTS_CONFIG_PATH
              value: /config/flights.json
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: hotel-flight-matcher
            items:
              - key: flights.json
                path: flights.json
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
