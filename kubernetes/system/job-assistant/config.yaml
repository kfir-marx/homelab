apiVersion: v1
kind: ConfigMap
metadata:
  name: job-assistant-config
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  search-criteria.yaml: |
    desired_titles:
      - DevOps Engineer
      - Platform Engineer
      - Site Reliability Engineer
    excluded_titles:
      - Intern
      - Sales
    seniority: [mid, senior]
    israel_locations: [Israel, Tel Aviv, Haifa, Jerusalem]
    fully_remote: true
    acceptable_timezone_difference_hours: 4
    required_technologies: [Kubernetes, Terraform, Linux]
    preferred_technologies: [Ansible, Argo CD, AWS, Python]
    excluded_companies: []
    preferred_companies: []
    minimum_match_threshold: 0.65
    maximum_job_age_days: 30
    language_preferences: [English, Hebrew]
    minimum_salary: null
    salary_currency: null
  company-registry.yaml: |
    # Intentionally disabled placeholders. Verify official ATS slugs and terms.
    companies:
      - company: Israeli technology company example
        ats: greenhouse
        slug: REPLACE_WITH_VERIFIED_GREENHOUSE_BOARD
        enabled: false
      - company: Remote-friendly company example
        ats: lever
        slug: REPLACE_WITH_VERIFIED_LEVER_SITE
        enabled: false
      - company: Additional remote company example
        ats: ashby
        slug: REPLACE_WITH_VERIFIED_ASHBY_BOARD
        enabled: false
