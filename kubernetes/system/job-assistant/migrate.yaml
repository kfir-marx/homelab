apiVersion: batch/v1
kind: Job
metadata:
  name: job-assistant-migrate
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: job-assistant
        component: migrate
    spec:
      priorityClassName: homelab-job-assistant
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/kfir-marx/homelab-job-assistant:sha-5e9b6ee39764b874d01fc2357b97393ea3e81eaf
          imagePullPolicy: IfNotPresent
          args: [migrate]
          env:
            - name: JOB_ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: DATABASE_URL
            - name: JOB_ASSISTANT_GENERATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-assistant-codex-db
                  key: DATABASE_URL
            - name: JOB_ASSISTANT_OWNER_TELEGRAM_USER_ID
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: OWNER_TELEGRAM_USER_ID
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
