apiVersion: v1
kind: Service
metadata:
  name: job-assistant-postgres
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app: job-assistant
    component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: job-assistant-postgres
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: job-assistant-postgres
  replicas: 1
  selector:
    matchLabels:
      app: job-assistant
      component: postgres
  template:
    metadata:
      labels:
        app: job-assistant
        component: postgres
    spec:
      priorityClassName: homelab-job-assistant
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6-bookworm
          env:
            - name: POSTGRES_DB
              value: job_assistant
            - name: POSTGRES_USER
              value: job_assistant
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: PGDATA
              value: /data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, job_assistant, -d, job_assistant]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, job_assistant, -d, job_assistant]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, job_assistant, -d, job_assistant]
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: job-assistant-postgres
