# Job-search history, contacts, CV artifacts, and Codex auth are personal and
# irreplaceable. They remain on the permanent critical NFS host. Every PV is
# hard-bound and Retained; Argo deletion cannot delete the backing directories.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: job-assistant-postgres-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage2
  mountOptions: [nfsvers=4.2, hard]
  claimRef:
    namespace: job-assistant
    name: job-assistant-postgres
  nfs:
    server: 192.168.1.105
    path: /mnt/storage2-bulk/job-assistant/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-assistant-postgres
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-storage2
  resources:
    requests:
      storage: 10Gi
  volumeName: job-assistant-postgres-pv
---
