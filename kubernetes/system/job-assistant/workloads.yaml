apiVersion: v1
kind: Service
metadata:
  name: job-assistant-api
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: job-assistant
    component: api
spec:
  type: ClusterIP
  selector:
    app: job-assistant
    component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-assistant-api
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-assistant
      component: api
  template:
    metadata:
      labels:
        app: job-assistant
        component: api
    spec:
      priorityClassName: homelab-job-assistant
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kfir-marx/homelab-job-assistant:sha-09ff69cec7adce7e55b8c87e33dad1d2fdf70a86
          imagePullPolicy: IfNotPresent
          args: [api]
          env:
            - name: JOB_ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: DATABASE_URL
            - name: JOB_ASSISTANT_SHARED_GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: JOB_ASSISTANT_API_TOKEN
            - name: JOB_ASSISTANT_SHARED_GATEWAY_NOTIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: JOB_ASSISTANT_NOTIFICATION_TOKEN
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: artifacts
              mountPath: /data
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: job-assistant-artifacts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-assistant-worker
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-assistant
      component: worker
  template:
    metadata:
      labels:
        app: job-assistant
        component: worker
    spec:
      priorityClassName: homelab-job-assistant
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/kfir-marx/homelab-job-assistant:sha-09ff69cec7adce7e55b8c87e33dad1d2fdf70a86
          imagePullPolicy: IfNotPresent
          args: [worker]
          env:
            - name: JOB_ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: DATABASE_URL
            - name: JOB_ASSISTANT_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: SMTP_HOST
            - name: JOB_ASSISTANT_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: SMTP_USERNAME
            - name: JOB_ASSISTANT_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: SMTP_PASSWORD
            - name: JOB_ASSISTANT_SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: SMTP_FROM
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: artifacts
              mountPath: /data
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: job-assistant-artifacts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-assistant-generation-broker
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-assistant
      component: generation-broker
  template:
    metadata:
      labels:
        app: job-assistant
        component: generation-broker
    spec:
      priorityClassName: homelab-job-assistant
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generation-broker
          image: ghcr.io/kfir-marx/homelab-job-assistant:sha-09ff69cec7adce7e55b8c87e33dad1d2fdf70a86
          imagePullPolicy: IfNotPresent
          args: [broker-worker]
          env:
            - name: JOB_ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-assistant-codex-db
                  key: DATABASE_URL
            - name: JOB_ASSISTANT_EXTERNAL_AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: EXTERNAL_AI_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
