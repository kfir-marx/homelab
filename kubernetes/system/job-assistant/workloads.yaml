apiVersion: v1
kind: Service
metadata:
  name: job-assistant-api
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: job-assistant
    component: api
spec:
  selector:
    app: job-assistant
    component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-assistant-api
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-assistant
      component: api
  template:
    metadata:
      labels:
        app: job-assistant
        component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kfir-marx/homelab-job-assistant:0.1.0
          args: [api]
          env:
            - name: JOB_ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-assistant-secrets
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
