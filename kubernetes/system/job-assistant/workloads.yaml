apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-assistant-generation
  namespace: job-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-assistant
      component: generation
  template:
    metadata:
      labels:
        app: job-assistant
        component: generation
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-codex-auth
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              umask 077
              if [ ! -s /codex-home/auth.json ]; then
                cp /bootstrap/auth.json /codex-home/auth.json
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: codex-home
              mountPath: /codex-home
            - name: auth-bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: generation
          image: ghcr.io/kfir-marx/homelab-job-assistant:0.1.0
          args: [generation-worker]
          env:
            - name: JOB_ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: job-assistant-codex-db
                  key: DATABASE_URL
            - name: JOB_ASSISTANT_CODEX_HOME
              value: /var/lib/codex
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: codex-home
              mountPath: /var/lib/codex
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: codex-home
          persistentVolumeClaim:
            claimName: job-assistant-codex-home
        - name: auth-bootstrap
          secret:
            secretName: job-assistant-codex-auth-bootstrap
            optional: true
            defaultMode: 0400
        - name: temporary
          emptyDir:
            sizeLimit: 1Gi
