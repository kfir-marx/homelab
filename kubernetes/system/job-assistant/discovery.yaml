  timeZone: Asia/Jerusalem
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: job-assistant
            component: reminders
        spec:
          priorityClassName: homelab-job-assistant
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reminders
              image: ghcr.io/kfir-marx/homelab-job-assistant:sha-fac0b0cd7867b8381b4374024229754b4990d893
              imagePullPolicy: IfNotPresent
              args: [reminders]
              env:
                - name: JOB_ASSISTANT_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: job-assistant-secrets
