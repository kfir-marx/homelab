apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media-http-redirect
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: argocd
      sectionName: private-http
  hostnames:
    - jellyfin.home.547600.xyz
    - seerr.home.547600.xyz
    - sonarr.home.547600.xyz
    - radarr.home.547600.xyz
    - prowlarr.home.547600.xyz
    - whisparr.home.547600.xyz
    - bazarr.home.547600.xyz
    - qbittorrent.home.547600.xyz
    - maintainerr.home.547600.xyz
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
