apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: argocd
      sectionName: private-https
  hostnames: [jellyfin.home.547600.xyz]
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
      matches:
        - path: {type: PathPrefix, value: /}
---
