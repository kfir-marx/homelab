apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      priorityClassName: homelab-media-jelliyfin
      nodeSelector:
        homelab.dev/gpu-node: gpu-3
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-state
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -ec
            - |
              install -d -o 1000 -g 1000 -m 0770 /state/jellyfin
              chmod 0777 /jellybridge

              # Jellyfin defaults both options to false. Without them, a fast
              # transcode/remux can retain the whole output and exceed the
              # pod-local cache limit before playback finishes.
              encoding_options=/state/jellyfin/config/encoding.xml
              if [ -f "${encoding_options}" ]; then
                sed -i \
                  -e 's#<EnableThrottling>[^<]*</EnableThrottling>#<EnableThrottling>true</EnableThrottling>#' \
                  -e 's#<EnableSegmentDeletion>[^<]*</EnableSegmentDeletion>#<EnableSegmentDeletion>true</EnableSegmentDeletion>#' \
                  "${encoding_options}"
                grep -q '<EnableThrottling>true</EnableThrottling>' "${encoding_options}"
                grep -q '<EnableSegmentDeletion>true</EnableSegmentDeletion>' "${encoding_options}"
                chown 1000:1000 "${encoding_options}"
              fi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          volumeMounts:
            - name: state
              mountPath: /state
            - name: data
              mountPath: /jellybridge
              subPath: jellybridge
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: media-config
                  key: TZ
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.547600.xyz
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 3Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: state
              mountPath: /config
              subPath: jellyfin
            - name: data
              mountPath: /data/media
              subPath: media
              readOnly: true
            - name: data
              mountPath: /data/jellybridge
              subPath: jellybridge
            - name: cache
              mountPath: /cache
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: media-state
        - name: data
          persistentVolumeClaim:
            claimName: media-data
        - name: cache
          emptyDir:
            # Protect gpu-3's system disk. Jellyfin throttles transcodes and
            # deletes downloaded HLS segments to stay below this guardrail.
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
