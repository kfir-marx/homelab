# Daily encrypted application-state backup. SQLite databases are copied with
# SQLite's online backup command; live WAL/SHM files are never archived.
# Provision the password Secret out-of-band and capture it into the SOPS
# recovery bundle as documented in the media and secrets runbooks.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-state-backup
  namespace: media
spec:
  schedule: "15 3 * * *"
  timeZone: Asia/Jerusalem
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: media-state-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: gpu-3
          securityContext:
            supplementalGroups:
              - 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              imagePullPolicy: IfNotPresent
              env:
                - name: MEDIA_BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: media-backup-credentials
                      key: password
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  umask 077
                  apk add --no-cache coreutils openssl sqlite >/dev/null

                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  stage="$(mktemp -d)"
                  mkdir -p "${stage}/state"
                  cp -R --no-preserve=all /state/. "${stage}/state/"

                  find "${stage}/state" -type f \
                    \( -name '*-wal' -o -name '*-shm' -o -name '*.pid' \) \
                    -delete
                  find "${stage}/state" -type d \
                    \( -name logs -o -name cache -o -name Sentry \) \
                    -prune -exec find {} -depth -delete \;

                  backup_db() {
                    source_path="$1"
                    relative_path="$2"
                    if [ -f "${source_path}" ]; then
                      destination="${stage}/state/${relative_path}"
                      mkdir -p "$(dirname "${destination}")"
                      # SQLite 3.53.4's CLI backup command can spin indefinitely
                      # on Jellyfin's valid WAL-mode database. VACUUM INTO is an
                      # official online-backup alternative and completed against
                      # the same database while preserving a read-only source.
                      snapshot="$(mktemp)"
                      rm -f "${snapshot}"
                      sqlite3 -readonly "${source_path}" \
                        "VACUUM INTO '${snapshot}';"
                      mv -f "${snapshot}" "${destination}"
                    fi
                  }

                  backup_db /state/jellyfin/data/jellyfin.db jellyfin/data/jellyfin.db
                  backup_db /state/sonarr/sonarr.db sonarr/sonarr.db
                  backup_db /state/radarr/radarr.db radarr/radarr.db
                  backup_db /state/prowlarr/prowlarr.db prowlarr/prowlarr.db
                  backup_db /state/whisparr/whisparr.db whisparr/whisparr.db
                  backup_db /state/bazarr/db/bazarr.db bazarr/db/bazarr.db
                  backup_db /state/seerr/db/db.sqlite3 seerr/db/db.sqlite3
                  backup_db /state/maintainerr/maintainerr.db maintainerr/maintainerr.db
                  backup_db /state/maintainerr/maintainerr.sqlite maintainerr/maintainerr.sqlite

                  tar -C "${stage}" -czf - state \
                    | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
                        -pass env:MEDIA_BACKUP_PASSWORD \
                        -out "/backup/media-state-${timestamp}.tar.gz.enc"

                  find /backup -maxdepth 1 -type f \
                    -name 'media-state-*.tar.gz.enc' -mtime +30 -delete
                  find "${stage}" -depth -delete
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: [ALL]
                  add: [DAC_OVERRIDE]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: state
                  mountPath: /state
                  readOnly: true
                - name: backups
                  mountPath: /backup
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: media-state
            - name: backups
              persistentVolumeClaim:
                claimName: media-backups
