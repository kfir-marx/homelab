apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - config.yaml
  - storage.yaml
  - jellyfin.yaml
  - servarr.yaml
  - bazarr.yaml
  - qbittorrent.yaml
  - seerr.yaml
  - maintainerr.yaml
  - maintainerr-storage-cleanup.yaml
  - backup.yaml
  - httproutes.yaml
  - network-policy.yaml

configMapGenerator:
  - name: bazarr-config-sync
    files:
      - reconcile.sh=bazarr_config_sync.sh
    options:
      # The Deployment reference is intentionally stable; changing this script
      # also requires touching the init-container manifest to trigger a rollout.
      disableNameSuffixHash: true
  - name: maintainerr-storage-cleanup
    files:
      - cleanup.py=maintainerr_storage_cleanup.py
      - maintainerr_config_sync.py=maintainerr_config_sync.py
    options:
      disableNameSuffixHash: true
  - name: qbittorrent-settings
    files:
      - enable-sequential.sh=qbittorrent-enable-sequential.sh
      - reconcile.sh=qbittorrent-settings.sh
    options:
      disableNameSuffixHash: true
