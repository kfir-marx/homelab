apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
  labels:
    app: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      priorityClassName: homelab-media-bazarr
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-state
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command:
            - sh
            - -ec
            - install -d -o 1000 -g 1000 -m 0770 /state/bazarr /state/bazarr/config
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: state
              mountPath: /state
        - name: reconcile-arr-integrations
          image: mikefarah/yq:4.53.6@sha256:cfc4eee658595834ef304eadb0c3ea721f3b7cb6404ad8b7cb909cc5b5145b23
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /app/reconcile.sh]
          env:
            - name: MEDIA_STATE_ROOT
              value: /state
            - name: TMPDIR
              value: /state/bazarr/config
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config-sync
              mountPath: /app
              readOnly: true
            - name: state
              mountPath: /state
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:v1.6.0-ls356@sha256:ab401a0f361cfad328e444838b13d5b334b189d0f556fc91a3623eb581df36df
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: media-config
          ports:
            - name: http
              containerPort: 6767
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /config
              subPath: bazarr
            - name: data
              mountPath: /data
      volumes:
        - name: config-sync
          configMap:
            name: bazarr-config-sync
            defaultMode: 0555
        - name: state
          persistentVolumeClaim:
            claimName: media-state
        - name: data
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
spec:
  selector:
    app: bazarr
  ports:
    - name: http
      port: 6767
      targetPort: http
