apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-to-tapy-frontend
  namespace: tapy
spec:
  podSelector:
    matchLabels:
      app: tapy
      component: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudflared
      podSelector:
        matchLabels:
          app: cloudflared
    ports:
    - port: 3000
      protocol: TCP
