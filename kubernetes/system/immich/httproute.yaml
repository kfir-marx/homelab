apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: argocd
      sectionName: private-http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: argocd
      sectionName: private-https
  hostnames:
    - immich.home.547600.xyz
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: immich-server
          port: 2283
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
