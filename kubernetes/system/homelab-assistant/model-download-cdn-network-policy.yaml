# Hugging Face redirects large model files to this regional CDN hostname.
# Keep it exact rather than broadening model-download-egress to arbitrary AWS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: model-download-cdn-egress
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchLabels:
      app: homelab-assistant
      component: inference
  egress:
    - toFQDNs:
        - matchName: us.aws.cdn.hf.co
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
