# The retained deterministic switcher uses a separately scoped identity.
# Kubernetes populates the token only in-cluster; no token is stored in Git.
apiVersion: v1
kind: Secret
metadata:
  name: homelab-assistant-switcher-token
  namespace: homelab-assistant
  annotations:
    kubernetes.io/service-account.name: homelab-assistant-switcher
type: kubernetes.io/service-account-token
