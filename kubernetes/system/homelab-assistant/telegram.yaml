apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-gateway
  namespace: homelab-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelab-assistant
      component: telegram
  template:
    metadata:
      labels:
        app: homelab-assistant
        component: telegram
    spec:
      priorityClassName: homelab-assistant
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # The first service commit builds a content-addressed image and opens
          # an automated PR that replaces this bootstrap tag before rollout.
          image: ghcr.io/kfir-marx/homelab-assistant:sha-f4af5e5c66b74255755944986dd6f2f063e2ebba
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMELAB_ASSISTANT_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: TELEGRAM_TOKEN
            - name: HOMELAB_ASSISTANT_TELEGRAM_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: TELEGRAM_ALLOWED_USER_IDS
            - name: HOMELAB_ASSISTANT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: LLM_API_KEY
            - name: HOMELAB_ASSISTANT_LLM_BASE_URL
              value: http://llm:8000/v1
            - name: HOMELAB_ASSISTANT_LLM_MODEL
              value: homelab-assistant
            - name: HOMELAB_ASSISTANT_SESSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: SESSION_DATABASE_URL
            - name: HOMELAB_ASSISTANT_EXTERNAL_AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: EXTERNAL_AI_TOKEN
            - name: HOMELAB_ASSISTANT_JOB_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: JOB_ASSISTANT_API_TOKEN
            - name: HOMELAB_ASSISTANT_JOB_ASSISTANT_NOTIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homelab-assistant-secrets
                  key: JOB_ASSISTANT_NOTIFICATION_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
