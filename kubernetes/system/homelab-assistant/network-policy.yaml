apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: homelab-assistant
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telegram-to-inference
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: homelab-assistant
      component: inference
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: homelab-assistant
              component: telegram
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telegram-to-inference-egress
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: homelab-assistant
      component: telegram
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: homelab-assistant
              component: inference
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-egress
  namespace: homelab-assistant
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: telegram-api-egress
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchLabels:
      app: homelab-assistant
      component: telegram
  egress:
    - toFQDNs:
        - matchName: api.telegram.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubernetes-api-egress
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchLabels:
      app: homelab-assistant
      component: telegram
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
# vLLM can download only the pinned public model snapshot. After the cache is
# warm this rule can be removed for a fully offline inference pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: model-download-egress
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchLabels:
      app: homelab-assistant
      component: inference
  egress:
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "*.huggingface.co"
        - matchName: hf.co
        - matchPattern: "*.hf.co"
        - matchPattern: "*.xethub.hf.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Kubelet probes originate from nodes rather than the Telegram pod. No service
# is exposed outside the cluster, and API calls still require the bearer key.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inference-health-probes
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchLabels:
      app: homelab-assistant
      component: inference
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-internal-services-egress
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: homelab-assistant
      component: telegram
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-ai
          podSelector:
            matchLabels:
              app: external-ai
              component: api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: job-assistant
          podSelector:
            matchLabels:
              app: job-assistant
              component: api
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-postgres
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: homelab-assistant
      component: telegram
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: homelab-assistant
              component: postgres
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: homelab-assistant
      component: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: homelab-assistant
              component: telegram
      ports:
        - port: 5432
