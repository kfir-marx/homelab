# The PostgreSQL workload is retired, but its critical recovery volume remains
# declaratively bound and Retained until the operator explicitly ends the
# migration/rollback window. No running workload depends on this claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homelab-assistant-postgres-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage2
  mountOptions: [nfsvers=4.2, hard]
  claimRef:
    namespace: homelab-assistant
    name: homelab-assistant-postgres
  nfs:
    server: 192.168.1.105
    path: /mnt/storage2-bulk/homelab-assistant/postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-assistant-postgres
  namespace: homelab-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-storage2
  volumeName: homelab-assistant-postgres-pv
  resources:
    requests:
      storage: 5Gi
