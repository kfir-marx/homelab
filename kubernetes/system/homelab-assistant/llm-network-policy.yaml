apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-llm-default-deny
  namespace: homelab-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [internal-llm, local-llm]
  policyTypes: [Ingress, Egress]
---
# Any namespaced pod may use the authenticated API. There is no north/south
# Service; the bearer token remains mandatory in addition to this boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-llm-cluster-clients
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: internal-llm
      component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-to-inference
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: local-llm
      component: inference
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: internal-llm
              component: worker
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-rabbitmq
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: internal-llm
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq
          podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-to-inference
  namespace: homelab-assistant
spec:
  podSelector:
    matchLabels:
      app: internal-llm
      component: worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: local-llm
              component: inference
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: internal-llm-dns-egress
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [internal-llm, local-llm]
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# The model and revision are pinned. Egress exists only to populate or repair
# the disposable cache; remove this rule if the cache is managed offline.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llm-model-download-egress
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchLabels:
      app: local-llm
      component: inference
  egress:
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "*.huggingface.co"
        - matchName: hf.co
        - matchPattern: "*.hf.co"
        - matchPattern: "*.xethub.hf.co"
        - matchName: us.aws.cdn.hf.co
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: internal-llm-health-probes
  namespace: homelab-assistant
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [internal-llm, local-llm]
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
