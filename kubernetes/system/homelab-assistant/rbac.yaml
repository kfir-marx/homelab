apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-assistant-switcher
  namespace: homelab-assistant
automountServiceAccountToken: false
---
# Kubernetes RBAC cannot restrict node patch or pod eviction by gpu-2's object
# name. The deterministic client rejects every node name except gpu-2 before
# making requests; this identity is never registered as an LLM tool.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-assistant-switcher
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - nonResourceURLs: [/readyz]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-assistant-switcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-assistant-switcher
subjects:
  - kind: ServiceAccount
    name: homelab-assistant-switcher
    namespace: homelab-assistant
