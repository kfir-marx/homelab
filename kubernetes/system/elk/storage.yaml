# Elasticsearch data is critical and remains on the permanent Ubuntu
# workstation. The two paths are independent because Lucene data directories
# must never be shared between Elasticsearch nodes.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elk-elasticsearch-data-0-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: elk
    homelab.kfir.dev/volume: elk-elasticsearch-data-0
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage2
  mountOptions:
    - nfsvers=4.2
    - hard
  claimRef:
    namespace: logging
    name: elasticsearch-data-elk-es-data-0
  nfs:
    server: 192.168.1.105
    path: /mnt/storage2-bulk/elk/elasticsearch-0
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elk-elasticsearch-data-1-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: elk
    homelab.kfir.dev/volume: elk-elasticsearch-data-1
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage2
  mountOptions:
    - nfsvers=4.2
    - hard
  claimRef:
    namespace: logging
    name: elasticsearch-data-elk-es-data-1
  nfs:
    server: 192.168.1.105
    path: /mnt/storage2-bulk/elk/elasticsearch-1
