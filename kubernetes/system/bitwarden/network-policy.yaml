# PostgreSQL accepts only the Bitwarden server and its backup job. Cilium's
# Gateway data-plane source identity is implementation-owned, so the web pod
# follows the same ClusterIP boundary as the other private applications.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: bitwarden
spec:
  podSelector:
    matchLabels:
      app: bitwarden
      component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: component
                operator: In
                values:
                  - server
                  - backup
      ports:
        - port: 5432
          protocol: TCP
