# This route remains a private access path on the shared Cilium Gateway. Public
# access reaches the same Service directly through the outbound Cloudflare
# Tunnel and does not traverse this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bitwarden
  namespace: bitwarden
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: argocd
      sectionName: private-https
  hostnames:
    - bitwarden.home.547600.xyz
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: bitwarden
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
# Redirect accidental HTTP requests to the HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bitwarden-http-redirect
  namespace: bitwarden
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
      namespace: argocd
      sectionName: private-http
  hostnames:
    - bitwarden.home.547600.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
