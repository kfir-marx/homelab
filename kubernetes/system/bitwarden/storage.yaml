# Bitwarden's database, attachments, identity certificate, and logical backups
# all live on the permanent critical NFS host. Each PV is hard-bound to its PVC
# and retained independently if the Application or claim is removed.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bitwarden-app-pv
  labels:
    app: bitwarden
    component: app-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage2
  mountOptions:
    - nfsvers=4.2
    - hard
  claimRef:
    namespace: bitwarden
    name: bitwarden-app
  nfs:
    server: 192.168.1.105
    path: /mnt/storage2-bulk/bitwarden/app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitwarden-app
  namespace: bitwarden
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-storage2
  resources:
    requests:
      storage: 10Gi
  volumeName: bitwarden-app-pv
---
