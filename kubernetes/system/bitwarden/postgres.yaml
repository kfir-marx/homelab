apiVersion: v1
kind: Service
metadata:
  name: bitwarden-postgres
  namespace: bitwarden
spec:
  type: ClusterIP
  selector:
    app: bitwarden
    component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bitwarden-postgres
  namespace: bitwarden
  labels:
    app: bitwarden
    component: postgres
spec:
  serviceName: bitwarden-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bitwarden
      component: postgres
  template:
    metadata:
      labels:
        app: bitwarden
        component: postgres
    spec:
      priorityClassName: homelab-bitwarden
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-postgres-data
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - mkdir -p /var/lib/postgresql/data/pgdata && chown -R 999:999 /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: bitwarden
            - name: POSTGRES_DB
              value: bitwarden_vault
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitwarden-secrets
                  key: BW_DB_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bitwarden
                - -d
                - bitwarden_vault
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bitwarden
                - -d
                - bitwarden_vault
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bitwarden
                - -d
                - bitwarden_vault
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitwarden-postgres
