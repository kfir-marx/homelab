# Non-secret Bitwarden Lite settings. TLS terminates at Cloudflare or the
# private Cilium Gateway, so the application listens on plain HTTP only inside
# the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bitwarden-config
  namespace: bitwarden
data:
  BW_DOMAIN: bitwarden.547600.xyz
  BW_DB_PROVIDER: postgresql
  BW_DB_SERVER: bitwarden-postgres
  BW_DB_PORT: "5432"
  BW_DB_DATABASE: bitwarden_vault
  BW_DB_USERNAME: bitwarden
  BW_ENABLE_SSL: "false"
  # The Admin process owns Lite database migrations and must remain enabled.
  # Portal login remains unavailable until adminSettings__admins is configured.
  BW_ENABLE_ADMIN: "true"
  BW_ENABLE_EVENTS: "false"
  BW_ENABLE_SCIM: "false"
  BW_ENABLE_SSO: "false"
  BW_ICONS_PROXY_TO_CLOUD: "false"
  PUID: "1000"
  PGID: "1000"
  globalSettings__enableCloudCommunication: "false"
  # Gmail SMTP uses a dedicated out-of-band bitwarden-smtp Secret for the
  # account address, reply-to address, and App Password. Port 587 uses
  # STARTTLS, so smtp.ssl stays false.
  globalSettings__mail__smtp__host: smtp.gmail.com
  globalSettings__mail__smtp__port: "587"
  globalSettings__mail__smtp__ssl: "false"
  globalSettings__mail__smtp__startTls: "true"
  globalSettings__mail__smtp__trustServer: "false"
  # Public exposure requires registration to remain closed. Create any intended
  # accounts through the private route before enabling the Cloudflare hostname.
  globalSettings__disableUserRegistration: "true"
