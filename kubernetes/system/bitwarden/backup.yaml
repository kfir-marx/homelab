# Nightly logical database and application-state snapshots protect against an
# accidental database or file change. They share the critical NFS failure
# domain and therefore do not replace an encrypted off-host backup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bitwarden-backup
  namespace: bitwarden
spec:
  schedule: "17 2 * * *"
  timeZone: Asia/Jerusalem
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: bitwarden
            component: backup
        spec:
          priorityClassName: homelab-bitwarden
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: docker.io/library/postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  umask 077
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  pg_dump --format=custom --host=bitwarden-postgres --username=bitwarden --dbname=bitwarden_vault > "/backup/database-${stamp}.dump"
                  tar -C /bitwarden -czf "/backup/app-${stamp}.tar.gz" .
                  find /backup -type f \( -name 'database-*.dump' -o -name 'app-*.tar.gz' \) -mtime +30 -delete
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: bitwarden-secrets
                      key: BW_DB_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backup
                - name: app-data
                  mountPath: /bitwarden
                  readOnly: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: bitwarden-backups
            - name: app-data
              persistentVolumeClaim:
                claimName: bitwarden-app
