apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: argocd
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.220
  listeners:
    # Keep ArgoCD's route limited to its own namespace.
    - name: argocd-http
      protocol: HTTP
      port: 80
      hostname: argocd.home.547600.xyz
      allowedRoutes:
        namespaces:
          from: Same
    # Application namespaces opt in with the
    # homelab.kfir.dev/private-gateway-access label.
    - name: private-http
      protocol: HTTP
      port: 80
      hostname: "*.home.547600.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.kfir.dev/private-gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: private
      sectionName: argocd-http
  hostnames:
    - argocd.home.547600.xyz
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
