apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: argocd
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.220
  listeners:
    # Keep ArgoCD's HTTPS route and HTTP redirect limited to its own namespace.
    - name: argocd-http
      protocol: HTTP
      port: 80
      hostname: argocd.home.547600.xyz
      allowedRoutes:
        namespaces:
          from: Same
    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: argocd.home.547600.xyz
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: private-home-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Same
    # Application namespaces opt in to HTTP redirects and HTTPS routes with
    # the homelab.kfir.dev/private-gateway-access label.
    - name: private-http
      protocol: HTTP
      port: 80
      hostname: "*.home.547600.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.kfir.dev/private-gateway-access: "true"
    # Trusted TLS for private applications. cert-manager renews the wildcard
    # certificate with a Cloudflare DNS-01 challenge; this listener still uses
    # only the private LAN VIP.
    - name: private-https
      protocol: HTTPS
      port: 443
      hostname: "*.home.547600.xyz"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: private-home-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.kfir.dev/private-gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: private
      sectionName: argocd-https
  hostnames:
    - argocd.home.547600.xyz
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-redirect
  namespace: argocd
spec:
  parentRefs:
    - name: private
      sectionName: argocd-http
  hostnames:
    - argocd.home.547600.xyz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: private-home-wildcard
  namespace: argocd
spec:
  secretName: private-home-wildcard-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  dnsNames:
    - "*.home.547600.xyz"
