apiVersion: v1
kind: Service
metadata:
  name: shared-services-telegram
  namespace: shared-services-telegram
  labels:
    app: shared-services-telegram
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: shared-services-telegram
    component: gateway
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-services-telegram
  namespace: shared-services-telegram
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shared-services-telegram
      component: gateway
  template:
    metadata:
      labels:
        app: shared-services-telegram
        component: gateway
    spec:
      priorityClassName: homelab-job-assistant
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # The first release workflow replaces this explicit non-image sentinel.
          image: ghcr.io/kfir-marx/homelab-shared-services-telegram:release-required
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARED_SERVICES_TELEGRAM_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shared-services-telegram-secrets
                  key: TELEGRAM_TOKEN
            - name: SHARED_SERVICES_TELEGRAM_JOB_ASSISTANT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shared-services-telegram-secrets
                  key: JOB_ASSISTANT_API_TOKEN
            - name: SHARED_SERVICES_TELEGRAM_JOB_ASSISTANT_NOTIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shared-services-telegram-secrets
                  key: JOB_ASSISTANT_NOTIFICATION_TOKEN
            - name: SHARED_SERVICES_TELEGRAM_JOB_ASSISTANT_BASE_URL
              value: http://job-assistant-api.job-assistant.svc.cluster.local:8080
          ports:
            - name: metrics
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

