apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-ai-postgres
spec:
  podSelector:
    matchLabels: {app: external-ai, component: postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: external-ai}
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-ai-to-postgres
spec:
  podSelector:
    matchLabels: {app: external-ai}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: external-ai, component: postgres}
      ports: [{port: 5432, protocol: TCP}]
