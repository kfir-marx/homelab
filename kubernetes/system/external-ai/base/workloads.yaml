apiVersion: v1
kind: Service
metadata:
  name: external-ai
  labels: {app: external-ai, component: api}
spec:
  type: ClusterIP
  selector: {app: external-ai, component: api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-ai-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: external-ai, component: api}
  template:
    metadata:
      labels: {app: external-ai, component: api}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/kfir-marx/homelab-external-ai:sha-572098ac8ed6826ba6a0f1e57ae30978d8c109e2
          args: [api]
          env:
            - name: EXTERNAL_AI_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: external-ai-secrets, key: DATABASE_URL}
            - name: EXTERNAL_AI_HOMELAB_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef: {name: external-ai-secrets, key: HOMELAB_ASSISTANT_TOKEN}
            - name: EXTERNAL_AI_JOB_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef: {name: external-ai-secrets, key: JOB_ASSISTANT_TOKEN}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-ai-worker
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: external-ai, component: worker}
  template:
    metadata:
      labels: {app: external-ai, component: worker}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: seed-codex-auth
          image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -ec
            - |
              umask 077
              if [ ! -s /codex-home/auth.json ] && [ -s /bootstrap/auth.json ]; then
                cp /bootstrap/auth.json /codex-home/auth.json
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: codex-home, mountPath: /codex-home}
            - {name: auth-bootstrap, mountPath: /bootstrap, readOnly: true}
      containers:
        - name: worker
          image: ghcr.io/kfir-marx/homelab-external-ai:sha-572098ac8ed6826ba6a0f1e57ae30978d8c109e2
          args: [worker]
          env:
            - name: EXTERNAL_AI_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: external-ai-secrets, key: DATABASE_URL}
            - name: EXTERNAL_AI_RABBITMQ_URL
              valueFrom:
                secretKeyRef: {name: external-ai-secrets, key: RABBITMQ_URL}
            - name: EXTERNAL_AI_ALIBABA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-ai-secrets
                  key: ALIBABA_API_KEY
                  optional: true
            - name: EXTERNAL_AI_REQUEST_QUEUE
              valueFrom:
                configMapKeyRef: {name: external-ai, key: REQUEST_QUEUE}
            - name: EXTERNAL_AI_RPC_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef: {name: external-ai, key: RPC_TIMEOUT_SECONDS}
            - name: EXTERNAL_AI_DEFAULT_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef: {name: external-ai, key: DEFAULT_TIMEOUT_SECONDS}
            - name: EXTERNAL_AI_MAXIMUM_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef: {name: external-ai, key: MAXIMUM_TIMEOUT_SECONDS}
            - name: EXTERNAL_AI_MAXIMUM_PROMPT_BYTES
              valueFrom:
                configMapKeyRef: {name: external-ai, key: MAXIMUM_PROMPT_BYTES}
            - name: EXTERNAL_AI_POLL_SECONDS
              valueFrom:
                configMapKeyRef: {name: external-ai, key: POLL_SECONDS}
            - name: EXTERNAL_AI_ALIBABA_BASE_URL
              valueFrom:
                configMapKeyRef: {name: external-ai, key: ALIBABA_BASE_URL}
            - {name: EXTERNAL_AI_CODEX_HOME, value: /var/lib/codex}
            - {name: EXTERNAL_AI_WORK_ROOT, value: /work}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: codex-home, mountPath: /var/lib/codex}
            - {name: work, mountPath: /work}
      volumes:
        - name: codex-home
          persistentVolumeClaim: {claimName: external-ai-codex-home}
        - name: auth-bootstrap
          secret:
            secretName: external-ai-codex-auth-bootstrap
            optional: true
            defaultMode: 0400
        - name: work
          emptyDir: {sizeLimit: 1Gi}
