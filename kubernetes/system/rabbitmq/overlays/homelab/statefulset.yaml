apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq, component: broker}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:4.3.5-management-alpine@sha256:ac1201d1dc227779d93c607f976e7f9156fd5b551ee5ff7946cab6c242091bf3
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: rabbitmq-secrets, key: username}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: rabbitmq-secrets, key: password}
            - name: RABBITMQ_DEFAULT_VHOST
              valueFrom:
                configMapKeyRef: {name: rabbitmq, key: DEFAULT_VHOST}
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef: {name: rabbitmq-secrets, key: erlang-cookie}
            - name: RABBITMQ_TAPY_PASSWORD
              valueFrom:
                secretKeyRef: {name: rabbitmq-tapy-user, key: password}
            - name: RABBITMQ_EXTERNAL_AI_PASSWORD
              valueFrom:
                secretKeyRef: {name: rabbitmq-external-ai-user, key: password}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
            - {name: prometheus, containerPort: 15692}
          startupProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, check_running]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    until rabbitmq-diagnostics -q check_running; do sleep 2; done
                    reconcile_user() {
                      user="$1"
                      password="$2"
                      if rabbitmqctl list_users --no-table-headers 2>/dev/null | awk '{print $1}' | grep -qx "$user"; then
                        rabbitmqctl change_password "$user" "$password" >/dev/null
                      else
                        rabbitmqctl add_user "$user" "$password" >/dev/null
                      fi
                      rabbitmqctl set_user_tags "$user" >/dev/null
                    }
                    reconcile_user tapy "$RABBITMQ_TAPY_PASSWORD"
                    rabbitmqctl set_permissions --vhost homelab tapy \
                      '^(internal-llm\.requests|external-ai\.requests|amq\.gen-.*|amq_[0-9a-f]{32})$' \
                      '^amq\.default$' '^(amq\.gen-.*|amq_[0-9a-f]{32})$' >/dev/null
                    reconcile_user external-ai "$RABBITMQ_EXTERNAL_AI_PASSWORD"
                    rabbitmqctl set_permissions --vhost homelab external-ai \
                      '^external-ai\.requests$' '^amq\.default$' \
                      '^external-ai\.requests$' >/dev/null
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf, readOnly: true}
            - {name: config, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins, readOnly: true}
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: rabbitmq}
        - name: data
          emptyDir: {sizeLimit: 10Gi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
