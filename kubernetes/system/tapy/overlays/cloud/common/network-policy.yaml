apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-controller-to-tapy
spec:
  podSelector:
    matchLabels: {app: tapy, component: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {networking.staymatch.io/ingress: "true"}
          podSelector:
            matchLabels: {networking.staymatch.io/controller: "true"}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tapy-public-egress
spec:
  endpointSelector:
    matchLabels: {app: tapy, component: api}
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        - {matchName: accounts.google.com}
        - {matchName: oauth2.googleapis.com}
        - {matchName: gmail.googleapis.com}
        - {matchName: login.microsoftonline.com}
        - {matchName: graph.microsoft.com}
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tapy-health-probes
spec:
  endpointSelector:
    matchLabels: {app: tapy, component: api}
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
