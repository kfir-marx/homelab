apiVersion: v1
kind: Service
metadata:
  name: tapy-postgres
spec:
  selector: {app: tapy, component: postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tapy-postgres
spec:
  serviceName: tapy-postgres
  replicas: 1
  selector:
    matchLabels: {app: tapy, component: postgres}
  template:
    metadata:
      labels: {app: tapy, component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.4-bookworm@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
          env:
            - {name: POSTGRES_DB, value: tapy}
            - {name: POSTGRES_USER, value: tapy}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: tapy-secrets, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, tapy, -d, tapy]}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: tapy-postgres}
