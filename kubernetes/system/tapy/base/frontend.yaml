apiVersion: v1
kind: Service
metadata:
  name: tapy-frontend
  labels:
    app: tapy
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: tapy
    component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapy-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tapy
      component: frontend
  template:
    metadata:
      labels:
        app: tapy
        component: frontend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/kfir-marx/tapy-frontend:sha-141798d9abdf5cf8c052717d9eb68c2181789f45
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: next-cache
          emptyDir: {sizeLimit: 128Mi}
