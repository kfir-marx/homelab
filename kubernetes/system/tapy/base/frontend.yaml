apiVersion: v1
kind: Service
metadata:
  name: tapy
  labels:
    app: tapy
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: tapy
    component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapy-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tapy
      component: frontend
  template:
    metadata:
      labels:
        app: tapy
        component: frontend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/kfir-marx/tapy-frontend:sha-1dff35256381fd42e25f343f53065ef5453c9cc7
          imagePullPolicy: IfNotPresent
          env:
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef: {name: tapy-frontend-secrets, key: TWILIO_ACCOUNT_SID}
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: tapy-frontend-secrets, key: TWILIO_AUTH_TOKEN}
            - name: AGENT_PHONE_NUMBER
              valueFrom:
                secretKeyRef: {name: tapy-frontend-secrets, key: AGENT_PHONE_NUMBER}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: tapy-frontend-secrets, key: GEMINI_API_KEY}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: next-cache
          emptyDir: {sizeLimit: 128Mi}
