apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tapy-default-deny
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels: {app: tapy, component: api}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tapy-frontend-default-deny
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels: {app: tapy, component: frontend}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tapy-frontend-to-backend
spec:
  podSelector:
    matchLabels: {app: tapy, component: frontend}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: tapy, component: api}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tapy-backend-from-frontend
spec:
  podSelector:
    matchLabels: {app: tapy, component: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: tapy, component: frontend}
      ports: [{port: 8080, protocol: TCP}]
