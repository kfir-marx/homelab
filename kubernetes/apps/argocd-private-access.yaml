# Private browser entry point for ArgoCD. The Cilium Gateway receives a LAN VIP
# and Headscale MagicDNS publishes argocd.homelab.ts.net only to VPN clients.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-private-access
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/argocd-private-access
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
