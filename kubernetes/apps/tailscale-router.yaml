# Tailscale subnet router — bridges the WireGuard mesh to 192.168.1.0/24.
# Advertising the LAN route lets official Tailscale clients reach Proxmox
# (192.168.1.105), Cilium LoadBalancer VIPs, and other LAN hosts remotely.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-router
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/tailscale-router
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale-router
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # The auth-key Secret is created out-of-band from an official Tailscale auth
  # key and backed up with SOPS — don't let ArgoCD prune it. tailscaled also
  # writes node state into a self-managed Secret that is included in recovery.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: tailscale-auth
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: tailscale-router-state-official
      jsonPointers:
        - /data
