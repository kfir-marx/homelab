# The deterministic switcher identity and inactive retained PostgreSQL recovery
# volume only. The Telegram Codex client runs on ubuntu-workstation; this
# Application owns no assistant workload, running database, or model cache.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-assistant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/homelab-assistant
  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-assistant
  # Intentionally manual for the one-time poller/database cutover. First sync
  # without prune to issue the switcher credential, then prune only after the
  # workstation gateway is running and rollback data has been verified.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
