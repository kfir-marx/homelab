# Rename transition only. Keep this object for one root-app synchronization so
# Argo CD removes its cascading resources finalizer while internal-llm adopts
# the same source. Delete this manifest in the follow-up commit only after the
# internal-llm Application is Healthy and owns the rendered resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-assistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/homelab-assistant
  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-assistant
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
