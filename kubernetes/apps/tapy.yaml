# Initial homelab cutover: reviewed immutable release, manual sync and no pruning.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tapy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: git@github.com:kfir-marx/tapy.git
    targetRevision: 806eee050b4500c5ff7370304b85e44f59e329db
    path: deploy/kubernetes/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: tapy
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    - SkipDryRunOnMissingResource=true
  ignoreDifferences:
  - group: ''
    kind: Secret
    name: tapy-secrets
    jsonPointers:
    - /data
  - group: ''
    kind: Secret
    name: tapy-frontend-secrets
    jsonPointers:
    - /data
  - group: apps
    kind: Deployment
    name: tapy-backend
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    name: tapy-frontend
    jsonPointers:
    - /spec/replicas
