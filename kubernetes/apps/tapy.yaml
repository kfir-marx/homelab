# Public OAuth/API backend. The only public path is the remotely managed
# Cloudflare Tunnel hostname; the origin Service remains ClusterIP-only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tapy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/tapy/overlays/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: tapy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: tapy-secrets
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: tapy-frontend-secrets
      jsonPointers: [/data]
    - group: apps
      kind: Deployment
      name: tapy-backend
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: tapy-frontend
      jsonPointers: [/spec/replicas]
