# AdGuard Home provides private DNS for *.home.547600.xyz and optional
# tailnet-wide ad/tracker blocking. DNS is reachable on the LAN through the
# dedicated Cilium LoadBalancer VIP; the admin UI uses the shared private
# Gateway and is not exposed by the DNS LoadBalancer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/adguard-home
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard-home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
