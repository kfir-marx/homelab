# Friend-shareable typed Telegram gateway. This Application is intentionally
# manual until the first tested image release PR replaces `release-required`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-services-telegram
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/shared-services-telegram
  destination:
    server: https://kubernetes.default.svc
    namespace: shared-services-telegram
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

