apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tapy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kfir-marx/homelab.git
    targetRevision: main
    path: kubernetes/system/tapy/overlays/cloud/in-cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: tapy
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false, PruneLast=true, RespectIgnoreDifferences=true]
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: tapy-secrets
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: tapy-frontend-secrets
      jsonPointers: [/data]
    - group: apps
      kind: Deployment
      name: tapy-backend
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: tapy-frontend
      jsonPointers: [/spec/replicas]
