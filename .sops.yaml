# `scripts/secrets.sh init` replaces this marker with the public recipient from
# the new age identity. The recipient is public; the passphrase-encrypted age
# identity is stored at secrets/age/homelab.agekey.age.
creation_rules:
  - path_regex: ^secrets/infrastructure\.sops\.env$
    age: AGE_RECIPIENT_PLACEHOLDER

  - path_regex: ^secrets/kubernetes/.*\.sops\.json$
    encrypted_regex: '^(data|stringData)$'
    age: AGE_RECIPIENT_PLACEHOLDER
