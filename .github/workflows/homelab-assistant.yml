name: "Homelab Assistant"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/homelab-assistant/**"
      - "kubernetes/apps/homelab-assistant.yaml"
      - "kubernetes/system/homelab-assistant/**"
      - "kubernetes/system/cloudflared/network-policy.yaml"
      - "kubernetes/system/media/network-policy.yaml"
      - "kubernetes/system/workload-priorities/priority-classes.yaml"
      - "docs/homelab-assistant-runbook.md"
      - "docs/media-stack-runbook.md"
      - "docs/network-policies.md"
      - "docs/remote-access.md"
      - ".github/workflows/homelab-assistant.yml"
  push:
    branches: [main]
    paths:
      - "services/homelab-assistant/**"
      - "kubernetes/apps/homelab-assistant.yaml"
      - "kubernetes/system/homelab-assistant/**"
      - "kubernetes/system/cloudflared/network-policy.yaml"
      - "kubernetes/system/media/network-policy.yaml"
      - "kubernetes/system/workload-priorities/priority-classes.yaml"
      - "docs/homelab-assistant-runbook.md"
      - "docs/media-stack-runbook.md"
      - "docs/network-policies.md"
      - "docs/remote-access.md"
      - ".github/workflows/homelab-assistant.yml"

permissions:
  contents: read

concurrency:
  group: homelab-assistant-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/kfir-marx/homelab-assistant

jobs:
  changes:
    name: "Detect releasable changes"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect service or release-workflow changes
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          release=false
          changed_file="${RUNNER_TEMP}/homelab-assistant-release-files.txt"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              release=true
            else
              git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- \
                services/homelab-assistant \
                .github/workflows/homelab-assistant.yml >"${changed_file}"
              if [[ -s "${changed_file}" ]]; then
                release=true
              fi
            fi
          fi
          echo "release decision: ${release}"
          echo "release=${release}" >>"${GITHUB_OUTPUT}"

  python:
    name: "Lint, type, and test"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/homelab-assistant/pyproject.toml
      - name: Install
        run: pip install -e 'services/homelab-assistant[dev]'
      - name: Ruff format
        run: ruff format --check services/homelab-assistant
      - name: Ruff lint
        run: ruff check services/homelab-assistant
      - name: Mypy
        run: mypy services/homelab-assistant/src services/homelab-assistant/tests
      - name: Tests
        run: pytest services/homelab-assistant

  manifests:
    name: "Render manifests"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.34.0
      - name: Render application resources
        run: |
          kubectl kustomize kubernetes/system/homelab-assistant >/tmp/homelab-assistant.yaml
          kubectl kustomize kubernetes/system/media >/tmp/media.yaml
      - name: Install kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          KUBECONFORM_VERSION: v0.7.0
        run: |
          archive="${RUNNER_TEMP}/kubeconform.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" kubeconform
          chmod 0755 "${RUNNER_TEMP}/kubeconform"
      - name: Offline schema validation
        run: |
          "${RUNNER_TEMP}/kubeconform" \
            -ignore-missing-schemas \
            -kubernetes-version 1.34.0 \
            -strict \
            -summary \
            /tmp/homelab-assistant.yaml \
            kubernetes/apps/homelab-assistant.yaml \
            kubernetes/system/cloudflared \
            kubernetes/system/workload-priorities/priority-classes.yaml \
            /tmp/media.yaml

  container:
    name: "Build and publish container"
    if: >-
      needs.python.result == 'success' &&
      needs.manifests.result == 'success' &&
      (github.event_name == 'pull_request' || needs.changes.outputs.release == 'true')
    needs: [changes, python, manifests]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/homelab-assistant
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-pr:
    name: "Open image release PR"
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.release == 'true'
    needs: [changes, container]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Pin the published image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          manifest=kubernetes/system/homelab-assistant/telegram.yaml
          grep --quiet "image: ${IMAGE_NAME}:" "${manifest}"
          sed --in-place --regexp-extended \
            "s|(image: ${IMAGE_NAME}:)[^[:space:]]+|\\1${IMAGE_TAG}|" "${manifest}"
          grep --quiet "image: ${IMAGE_NAME}:${IMAGE_TAG}" "${manifest}"
      - name: Create or update the release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: kubernetes/system/homelab-assistant/telegram.yaml
          branch: automation/homelab-assistant-image
          base: main
          delete-branch: true
          commit-message: "deploy(homelab-assistant): pin image sha-${{ github.sha }}"
          title: "deploy(homelab-assistant): release sha-${{ github.sha }}"
          body: |
            Publish the successfully tested image from `${{ github.sha }}`.

            Image: `${{ env.IMAGE_NAME }}:sha-${{ github.sha }}`
