name: "Homelab Assistant"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/homelab-assistant/**"
      - "kubernetes/apps/internal-llm.yaml"
      - "kubernetes/system/homelab-assistant/**"
      - "ansible/roles/homelab_assistant/**"
      - "ansible/roles/homelab_vm_actuator/**"
      - "ansible/inventory/production/host_vars/ubuntu-workstation.yml"
      - "ansible/inventory/production/host_vars/largegpu.yml"
      - "ansible/inventory/production/group_vars/all.yml"
      - "ansible/playbooks/configure-ubuntu-workstation.yml"
      - "ansible/playbooks/configure-proxmox.yml"
      - "kubernetes/system/cloudflared/network-policy.yaml"
      - "kubernetes/system/media/network-policy.yaml"
      - "kubernetes/system/workload-priorities/priority-classes.yaml"
      - "kubernetes/system/job-assistant/network-policy.yaml"
      - "kubernetes/system/external-ai/network-policy.yaml"
      - "docs/homelab-assistant-runbook.md"
      - "docs/media-stack-runbook.md"
      - "docs/network-policies.md"
      - "docs/remote-access.md"
      - ".github/workflows/homelab-assistant.yml"
  push:
    branches: [main]
    paths:
      - "services/homelab-assistant/**"
      - "kubernetes/apps/internal-llm.yaml"
      - "kubernetes/system/homelab-assistant/**"
      # Do not re-run after an internal-llm image-release PR updates its tag.
      - "!kubernetes/system/homelab-assistant/gateway.yaml"
      - "ansible/roles/homelab_assistant/**"
      - "ansible/roles/homelab_vm_actuator/**"
      - "ansible/inventory/production/host_vars/ubuntu-workstation.yml"
      # Do not re-run after this workflow's image-release PR updates its tag.
      - "!ansible/inventory/production/host_vars/ubuntu-workstation.yml"
      - "ansible/inventory/production/host_vars/largegpu.yml"
      - "ansible/inventory/production/group_vars/all.yml"
      - "ansible/playbooks/configure-ubuntu-workstation.yml"
      - "ansible/playbooks/configure-proxmox.yml"
      - "kubernetes/system/cloudflared/network-policy.yaml"
      - "kubernetes/system/media/network-policy.yaml"
      - "kubernetes/system/workload-priorities/priority-classes.yaml"
      - "kubernetes/system/job-assistant/network-policy.yaml"
      - "kubernetes/system/external-ai/network-policy.yaml"
      - "docs/homelab-assistant-runbook.md"
      - "docs/media-stack-runbook.md"
      - "docs/network-policies.md"
      - "docs/remote-access.md"
      - ".github/workflows/homelab-assistant.yml"

permissions:
  contents: read

concurrency:
  group: homelab-assistant-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/kfir-marx/homelab-assistant

jobs:
  changes:
    name: "Detect releasable changes"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect service or release-workflow changes
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          release=false
          changed_file="${RUNNER_TEMP}/homelab-assistant-release-files.txt"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            release=true
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              release=true
            else
              git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- \
                services/homelab-assistant \
                .github/workflows/homelab-assistant.yml >"${changed_file}"
              if [[ -s "${changed_file}" ]]; then
                release=true
              fi
            fi
          fi
          echo "release decision: ${release}"
          echo "release=${release}" >>"${GITHUB_OUTPUT}"

  python:
    name: "Lint, type, and test"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: services/homelab-assistant/uv.lock
      - name: Install locked dependencies
        working-directory: services/homelab-assistant
        run: uv sync --locked --extra dev
      - name: Ruff format
        run: |
          uv run --directory services/homelab-assistant --locked --extra dev ruff format --check .
          uv run --directory services/homelab-assistant --locked --extra dev ruff format \
            --check --target-version py313 \
            ../../ansible/roles/homelab_assistant/files/homelab-codex-socket-proxy.py \
            ../../ansible/roles/homelab_vm_actuator/files/homelab-vm-actuator \
            ../../ansible/roles/homelab_vm_actuator/files/homelab-vm-actuator-dispatch
      - name: Ruff lint
        run: |
          uv run --directory services/homelab-assistant --locked --extra dev ruff check .
          uv run --directory services/homelab-assistant --locked --extra dev ruff check \
            --target-version py313 \
            ../../ansible/roles/homelab_assistant/files/homelab-codex-socket-proxy.py \
            ../../ansible/roles/homelab_vm_actuator/files/homelab-vm-actuator \
            ../../ansible/roles/homelab_vm_actuator/files/homelab-vm-actuator-dispatch
      - name: Check Proxmox Python compatibility
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path("ansible/roles/homelab_vm_actuator/files")
          for name in ("homelab-vm-actuator", "homelab-vm-actuator-dispatch"):
              path = root / name
              ast.parse(path.read_text(), filename=str(path), feature_version=(3, 13))
          PY
      - name: Mypy
        run: uv run --directory services/homelab-assistant --locked --extra dev mypy src tests
      - name: Tests
        run: uv run --directory services/homelab-assistant --locked --extra dev pytest

  manifests:
    name: "Render manifests"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.34.0
      - name: Render application resources
        run: |
          kubectl kustomize kubernetes/system/homelab-assistant >/tmp/homelab-assistant.yaml
          kubectl kustomize kubernetes/system/media >/tmp/media.yaml
      - name: Install kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          KUBECONFORM_VERSION: v0.7.0
        run: |
          archive="${RUNNER_TEMP}/kubeconform.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" kubeconform
          chmod 0755 "${RUNNER_TEMP}/kubeconform"
      - name: Offline schema validation
        run: |
          "${RUNNER_TEMP}/kubeconform" \
            -ignore-missing-schemas \
            -kubernetes-version 1.34.0 \
            -strict \
            -summary \
            /tmp/homelab-assistant.yaml \
            kubernetes/apps/internal-llm.yaml \
            kubernetes/system/cloudflared \
            kubernetes/system/workload-priorities/priority-classes.yaml \
            kubernetes/system/job-assistant/network-policy.yaml \
            kubernetes/system/external-ai/network-policy.yaml \
            /tmp/media.yaml

  ansible:
    name: "Ansible syntax"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install Ansible Core
        run: python -m pip install "ansible-core>=2.16,<2.20"
      - name: Validate affected playbooks
        working-directory: ansible
        run: |
          ansible-playbook playbooks/configure-ubuntu-workstation.yml --syntax-check
          ansible-playbook playbooks/configure-proxmox.yml --syntax-check

  container:
    name: "Build and publish container"
    if: >-
      needs.python.result == 'success' &&
      needs.manifests.result == 'success' &&
      needs.ansible.result == 'success' &&
      (github.event_name == 'pull_request' || needs.changes.outputs.release == 'true')
    needs: [changes, python, manifests, ansible]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/homelab-assistant
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-pr:
    name: "Open image release PR"
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.release == 'true'
    needs: [changes, container]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Pin the published image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          manifest=ansible/inventory/production/host_vars/ubuntu-workstation.yml
          grep --quiet "homelab_assistant_image: ${IMAGE_NAME}:" "${manifest}"
          sed --in-place --regexp-extended \
            "s|(homelab_assistant_image: ${IMAGE_NAME}:)[^[:space:]]+|\\1${IMAGE_TAG}|" "${manifest}"
          grep --quiet "homelab_assistant_image: ${IMAGE_NAME}:${IMAGE_TAG}" "${manifest}"
      - name: Create or update the release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ansible/inventory/production/host_vars/ubuntu-workstation.yml
          branch: automation/homelab-assistant-image
          base: main
          delete-branch: true
          commit-message: "deploy(homelab-assistant): pin image sha-${{ github.sha }}"
          title: "deploy(homelab-assistant): release sha-${{ github.sha }}"
          body: |
            Publish the successfully tested image from `${{ github.sha }}`.

            Image: `${{ env.IMAGE_NAME }}:sha-${{ github.sha }}`
