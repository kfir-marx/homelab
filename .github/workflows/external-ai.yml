name: external-ai

on:
  pull_request:
    paths:
      - services/external-ai/**
      - kubernetes/apps/external-ai.yaml
      - kubernetes/system/external-ai/**
      - "!kubernetes/system/external-ai/workloads.yaml"
      - .github/workflows/external-ai.yml
  push:
    branches: [main]
    paths:
      - services/external-ai/**
      - .github/workflows/external-ai.yml

permissions:
  contents: read

concurrency:
  group: external-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/kfir-marx/homelab-external-ai

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: services/external-ai/uv.lock
      - run: uv sync --directory services/external-ai --locked --extra dev
      - run: uv run --directory services/external-ai --locked --extra dev ruff format --check .
      - run: uv run --directory services/external-ai --locked --extra dev ruff check .
      - run: uv run --directory services/external-ai --locked --extra dev mypy src tests
      - run: uv run --directory services/external-ai --locked --extra dev pytest
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - run: kubectl kustomize kubernetes/system/external-ai >/tmp/external-ai.yaml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/external-ai
          push: false

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/external-ai
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Pin immutable image
        run: >-
          sed -i
          's|ghcr.io/kfir-marx/homelab-external-ai:sha-[a-f0-9]*|ghcr.io/kfir-marx/homelab-external-ai:sha-${{ github.sha }}|g;
          s|ghcr.io/kfir-marx/homelab-external-ai:sha-bootstrap|ghcr.io/kfir-marx/homelab-external-ai:sha-${{ github.sha }}|g'
          kubernetes/system/external-ai/workloads.yaml
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/external-ai-image
          delete-branch: true
          commit-message: "deploy(external-ai): pin image sha-${{ github.sha }}"
          title: "deploy(external-ai): release sha-${{ github.sha }}"
          body: Automated immutable image release.
