name: tapy

on:
  pull_request:
    paths:
      - services/tapy/**
      - kubernetes/apps/tapy.yaml
      - kubernetes/system/tapy/**
      - kubernetes/system/cloudflared/network-policy.yaml
      - kubernetes/system/homelab-assistant/gateway.yaml
      - docs/tapy-runbook.md
      - .github/workflows/tapy.yml
  push:
    branches: [main]
    paths:
      - services/tapy/**
      - .github/workflows/tapy.yml

permissions:
  contents: read

concurrency:
  group: tapy-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE_NAME: ghcr.io/kfir-marx/tapy
  FRONTEND_IMAGE_NAME: ghcr.io/kfir-marx/tapy-frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: services/tapy/backend/uv.lock
      - run: uv sync --directory services/tapy/backend --locked --extra dev
      - run: uv run --directory services/tapy/backend --locked --extra dev ruff format --check .
      - run: uv run --directory services/tapy/backend --locked --extra dev ruff check .
      - run: uv run --directory services/tapy/backend --locked --extra dev mypy src tests
      - run: uv run --directory services/tapy/backend --locked --extra dev pytest
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/tapy/frontend/package-lock.json
      - name: Verify frontend
        working-directory: services/tapy/frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
      - name: Render manifests
        run: |
          kubectl kustomize kubernetes/system/tapy/overlays/homelab >/tmp/tapy.yaml
          kubectl kustomize kubernetes/system/tapy/overlays/cloud/in-cluster >/tmp/tapy-cloud-in-cluster.yaml
          kubectl kustomize kubernetes/system/tapy/overlays/cloud/managed >/tmp/tapy-cloud-managed.yaml
          kubectl kustomize kubernetes/system/homelab-assistant >/tmp/homelab-assistant.yaml
          kubectl kustomize kubernetes/system/cloudflared >/tmp/cloudflared.yaml
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/tapy/backend
          push: false
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/tapy/frontend
          push: false

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/tapy/backend
          push: true
          tags: ${{ env.BACKEND_IMAGE_NAME }}:sha-${{ github.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/tapy/frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Pin immutable images
        run: |
          sed -i \
            's|image: ghcr.io/kfir-marx/tapy:.*|image: ghcr.io/kfir-marx/tapy:sha-${{ github.sha }}|' \
            kubernetes/system/tapy/base/workload.yaml
          sed -i \
            's|image: ghcr.io/kfir-marx/tapy-frontend:.*|image: ghcr.io/kfir-marx/tapy-frontend:sha-${{ github.sha }}|' \
            kubernetes/system/tapy/base/frontend.yaml
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/tapy-image
          delete-branch: true
          commit-message: "deploy(tapy): pin images sha-${{ github.sha }}"
          title: "deploy(tapy): release sha-${{ github.sha }}"
          body: Automated immutable backend and frontend image release.
