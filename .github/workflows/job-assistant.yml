name: "Job Assistant"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/job-assistant/**"
      - "services/shared-services-telegram/**"
      - "kubernetes/apps/job-assistant.yaml"
      - "kubernetes/apps/shared-services-telegram.yaml"
      - "kubernetes/system/job-assistant/**"
      - "kubernetes/system/shared-services-telegram/**"
      - "!kubernetes/system/job-assistant/discovery.yaml"
      - "!kubernetes/system/job-assistant/migrate.yaml"
      - "!kubernetes/system/job-assistant/workloads.yaml"
      - "docs/job-assistant-*.md"
      - "docs/shared-services-telegram-runbook.md"
      - ".github/workflows/job-assistant.yml"
  push:
    branches: [main]
    paths:
      - "services/job-assistant/**"
      - "services/shared-services-telegram/**"
      - "kubernetes/apps/job-assistant.yaml"
      - "kubernetes/apps/shared-services-telegram.yaml"
      - "kubernetes/system/job-assistant/**"
      - "kubernetes/system/shared-services-telegram/**"
      # Do not re-run after the release PR pins the gateway image tag.
      - "!kubernetes/system/shared-services-telegram/workload.yaml"
      - "!kubernetes/system/job-assistant/discovery.yaml"
      - "!kubernetes/system/job-assistant/migrate.yaml"
      - "!kubernetes/system/job-assistant/workloads.yaml"
      - "docs/job-assistant-*.md"
      - "docs/shared-services-telegram-runbook.md"
      - ".github/workflows/job-assistant.yml"

permissions:
  contents: read

concurrency:
  group: job-assistant-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/kfir-marx/homelab-job-assistant
  GATEWAY_IMAGE_NAME: ghcr.io/kfir-marx/homelab-shared-services-telegram

jobs:
  changes:
    name: "Detect releasable changes"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect service or release-workflow changes
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          release=false
          changed_file="${RUNNER_TEMP}/job-assistant-release-files.txt"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              release=true
            else
              git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- \
              services/job-assistant \
              services/shared-services-telegram \
              .github/workflows/job-assistant.yml >"${changed_file}"
              if [[ -s "${changed_file}" ]]; then
                release=true
              fi
            fi
          fi
          echo "release decision: ${release}"
          echo "release=${release}" >>"${GITHUB_OUTPUT}"

  python:
    name: "Lint, type, test, migrate"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: job_assistant_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: job_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_assistant_test -d job_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.6"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: |
            services/job-assistant/uv.lock
            services/shared-services-telegram/uv.lock
      - name: Install locked dependencies
        working-directory: services/job-assistant
        run: uv sync --locked --extra dev
      - name: Install locked gateway dependencies
        working-directory: services/shared-services-telegram
        run: uv sync --locked --extra dev
      - name: Ruff format
        run: |
          uv run --directory services/job-assistant --locked --extra dev ruff format --check .
          uv run --directory services/shared-services-telegram --locked --extra dev ruff format --check .
      - name: Ruff lint
        run: |
          uv run --directory services/job-assistant --locked --extra dev ruff check .
          uv run --directory services/shared-services-telegram --locked --extra dev ruff check .
      - name: Mypy
        run: |
          uv run --directory services/job-assistant --locked --extra dev mypy src tests
          uv run --directory services/shared-services-telegram --locked --extra dev mypy src tests
      - name: Tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://job_assistant_test:test-only-password@localhost:5432/job_assistant_test
        run: |
          uv run --directory services/job-assistant --locked --extra dev pytest --cov=job_assistant --cov-report=term-missing
          uv run --directory services/shared-services-telegram --locked --extra dev pytest

  manifests:
    name: "Render manifests"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
        with:
          version: v1.33.0
      - name: Render application resources
        run: |
          kubectl kustomize kubernetes/system/job-assistant >/tmp/job-assistant.yaml
          kubectl kustomize kubernetes/system/shared-services-telegram >/tmp/shared-services-telegram.yaml
      - name: Install kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          KUBECONFORM_VERSION: v0.7.0
        run: |
          archive="${RUNNER_TEMP}/kubeconform.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" kubeconform
          chmod 0755 "${RUNNER_TEMP}/kubeconform"
      - name: Offline schema validation
        run: |
          "${RUNNER_TEMP}/kubeconform" \
            -ignore-missing-schemas \
            -kubernetes-version 1.33.0 \
            -strict \
            -summary \
            /tmp/job-assistant.yaml \
            /tmp/shared-services-telegram.yaml \
            kubernetes/apps/job-assistant.yaml \
            kubernetes/apps/shared-services-telegram.yaml

  container:
    name: "Build and publish ${{ matrix.name }} container"
    if: >-
      needs.python.result == 'success' &&
      needs.manifests.result == 'success' &&
      (github.event_name == 'pull_request' || needs.changes.outputs.release == 'true')
    needs: [changes, python, manifests]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: job-assistant
            context: services/job-assistant
            image: ghcr.io/kfir-marx/homelab-job-assistant
          - name: shared-services-telegram
            context: services/shared-services-telegram
            image: ghcr.io/kfir-marx/homelab-shared-services-telegram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-pr:
    name: "Open image release PR"
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.release == 'true'
    needs: [changes, container]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Pin the published image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          manifests=(
            kubernetes/system/job-assistant/discovery.yaml
            kubernetes/system/job-assistant/migrate.yaml
            kubernetes/system/job-assistant/workloads.yaml
          )
          before_count="$(grep --extended-regexp --only-matching --no-filename \
            "image: ${IMAGE_NAME}:[^[:space:]]+" "${manifests[@]}" | wc --lines)"
          test "${before_count}" -eq 5
          sed --in-place --regexp-extended \
            "s|(image: ${IMAGE_NAME}:)[^[:space:]]+|\\1${IMAGE_TAG}|" \
            "${manifests[@]}"
          after_count="$(grep --fixed-strings --only-matching --no-filename \
            "image: ${IMAGE_NAME}:${IMAGE_TAG}" "${manifests[@]}" | wc --lines)"
          test "${after_count}" -eq 5
          gateway_manifest=kubernetes/system/shared-services-telegram/workload.yaml
          gateway_before="$(grep --extended-regexp --only-matching --no-filename \
            "image: ${GATEWAY_IMAGE_NAME}:[^[:space:]]+" "${gateway_manifest}" | wc --lines)"
          test "${gateway_before}" -eq 1
          sed --in-place --regexp-extended \
            "s|(image: ${GATEWAY_IMAGE_NAME}:)[^[:space:]]+|\1${IMAGE_TAG}|" \
            "${gateway_manifest}"
          grep --fixed-strings --quiet \
            "image: ${GATEWAY_IMAGE_NAME}:${IMAGE_TAG}" "${gateway_manifest}"
      - name: Create or update the release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            kubernetes/system/job-assistant/discovery.yaml
            kubernetes/system/job-assistant/migrate.yaml
            kubernetes/system/job-assistant/workloads.yaml
            kubernetes/system/shared-services-telegram/workload.yaml
          branch: automation/job-assistant-image
          base: main
          delete-branch: true
          commit-message: "deploy(job-assistant): pin image sha-${{ github.sha }}"
          title: "deploy(job-assistant): release sha-${{ github.sha }}"
          body: |
            Publish the successfully tested image from `${{ github.sha }}`.

            Images:
            - `${{ env.IMAGE_NAME }}:sha-${{ github.sha }}`
            - `${{ env.GATEWAY_IMAGE_NAME }}:sha-${{ github.sha }}`

            Merging this PR lets Argo CD run the migration hook and roll the
            Deployments through the normal GitOps reconciliation path.
