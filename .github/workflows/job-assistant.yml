name: "Job Assistant"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/job-assistant/**"
      - "kubernetes/apps/job-assistant.yaml"
      - "kubernetes/system/job-assistant/**"
      - "docs/job-assistant-*.md"
      - ".github/workflows/job-assistant.yml"
  push:
    branches: [main]
    paths:
      - "services/job-assistant/**"
      - "kubernetes/apps/job-assistant.yaml"
      - "kubernetes/system/job-assistant/**"
      - "docs/job-assistant-*.md"
      - ".github/workflows/job-assistant.yml"

permissions:
  contents: read

concurrency:
  group: job-assistant-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/kfir-marx/homelab-job-assistant

jobs:
  changes:
    name: "Detect releasable changes"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect service or release-workflow changes
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          release=false
          changed_file="${RUNNER_TEMP}/job-assistant-release-files.txt"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              release=true
            else
              git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- \
              services/job-assistant \
              .github/workflows/job-assistant.yml >"${changed_file}"
              if [[ -s "${changed_file}" ]]; then
                release=true
              fi
            fi
          fi
          echo "release decision: ${release}"
          echo "release=${release}" >>"${GITHUB_OUTPUT}"

  python:
    name: "Lint, type, test, migrate"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: job_assistant_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: job_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_assistant_test -d job_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: services/job-assistant/uv.lock
      - name: Install locked dependencies
        working-directory: services/job-assistant
        run: uv sync --locked --extra dev
      - name: Ruff format
        run: uv run --directory services/job-assistant --locked --extra dev ruff format --check .
      - name: Ruff lint
        run: uv run --directory services/job-assistant --locked --extra dev ruff check .
      - name: Mypy
        run: uv run --directory services/job-assistant --locked --extra dev mypy src
      - name: Tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://job_assistant_test:test-only-password@localhost:5432/job_assistant_test
        run: uv run --directory services/job-assistant --locked --extra dev pytest --cov=job_assistant --cov-report=term-missing

  manifests:
    name: "Render manifests"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.33.0
      - name: Render application resources
        run: kubectl kustomize kubernetes/system/job-assistant >/tmp/job-assistant.yaml
      - name: Install kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          KUBECONFORM_VERSION: v0.7.0
        run: |
          archive="${RUNNER_TEMP}/kubeconform.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" kubeconform
          chmod 0755 "${RUNNER_TEMP}/kubeconform"
      - name: Offline schema validation
        run: |
          "${RUNNER_TEMP}/kubeconform" \
            -ignore-missing-schemas \
            -kubernetes-version 1.33.0 \
            -strict \
            -summary \
            /tmp/job-assistant.yaml \
            kubernetes/apps/job-assistant.yaml

  container:
    name: "Build and publish container"
    if: >-
      needs.python.result == 'success' &&
      needs.manifests.result == 'success' &&
      (github.event_name == 'pull_request' || needs.changes.outputs.release == 'true')
    needs: [changes, python, manifests]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/job-assistant
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-pr:
    name: "Open image release PR"
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.release == 'true'
    needs: [changes, container]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Pin the published image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          manifests=(
            kubernetes/system/job-assistant/discovery.yaml
            kubernetes/system/job-assistant/migrate.yaml
            kubernetes/system/job-assistant/workloads.yaml
          )
          before_count="$(grep --extended-regexp --only-matching --no-filename \
            "image: ${IMAGE_NAME}:[^[:space:]]+" "${manifests[@]}" | wc --lines)"
          test "${before_count}" -eq 5
          sed --in-place --regexp-extended \
            "s|(image: ${IMAGE_NAME}:)[^[:space:]]+|\\1${IMAGE_TAG}|" \
            "${manifests[@]}"
          after_count="$(grep --fixed-strings --only-matching --no-filename \
            "image: ${IMAGE_NAME}:${IMAGE_TAG}" "${manifests[@]}" | wc --lines)"
          test "${after_count}" -eq 5
      - name: Create or update the release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            kubernetes/system/job-assistant/discovery.yaml
            kubernetes/system/job-assistant/migrate.yaml
            kubernetes/system/job-assistant/workloads.yaml
          branch: automation/job-assistant-image
          base: main
          delete-branch: true
          commit-message: "deploy(job-assistant): pin image sha-${{ github.sha }}"
          title: "deploy(job-assistant): release sha-${{ github.sha }}"
          body: |
            Publish the successfully tested image from `${{ github.sha }}`.

            Image: `${{ env.IMAGE_NAME }}:sha-${{ github.sha }}`

            Merging this PR lets Argo CD run the migration hook and roll the
            Deployments through the normal GitOps reconciliation path.
