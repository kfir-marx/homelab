name: "Secrets Ciphertext Policy"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".sops.yaml"
      - ".env-template"
      - ".gitignore"
      - "secrets/**"
      - "scripts/secrets.sh"
      - ".github/workflows/secrets-policy.yml"
  push:
    branches: [main]
    paths:
      - ".sops.yaml"
      - ".env-template"
      - ".gitignore"
      - "secrets/**"
      - "scripts/secrets.sh"
      - ".github/workflows/secrets-policy.yml"

permissions:
  contents: read

jobs:
  ciphertext-only:
    name: "Ciphertext-only recovery bundle"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate shell syntax
        run: bash -n scripts/secrets.sh

      - name: Reject plaintext recovery files
        run: scripts/secrets.sh audit
