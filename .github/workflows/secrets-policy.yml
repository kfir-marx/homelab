name: "Secrets Ciphertext Policy"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".sops.yaml"
      - ".env-template"
      - ".gitignore"
      - "secrets/**"
      - "scripts/secrets.sh"
      - ".github/workflows/secrets-policy.yml"
  push:
    branches: [main]
    paths:
      - ".sops.yaml"
      - ".env-template"
      - ".gitignore"
      - "secrets/**"
      - "scripts/secrets.sh"
      - ".github/workflows/secrets-policy.yml"

permissions:
  contents: read

jobs:
  ciphertext-only:
    name: "Ciphertext-only recovery bundle"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate shell syntax
        run: bash -n scripts/secrets.sh

      - name: Reject plaintext recovery files
        run: scripts/secrets.sh audit
