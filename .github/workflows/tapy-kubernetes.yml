name: tapy portable Kubernetes

on:
  pull_request:
    paths:
      - kubernetes/system/tapy/**
      - kubernetes/system/external-ai/**
      - kubernetes/system/rabbitmq/**
      - kubernetes/apps/tapy.yaml
      - kubernetes/apps/external-ai.yaml
      - kubernetes/apps/rabbitmq.yaml
      - kubernetes/apps/cloud/**
      - .github/workflows/tapy-kubernetes.yml

permissions:
  contents: read

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
      - name: Render every overlay
        shell: bash
        run: |
          set -euo pipefail
          overlays=(
            kubernetes/system/tapy/overlays/homelab
            kubernetes/system/tapy/overlays/cloud/in-cluster
            kubernetes/system/tapy/overlays/cloud/managed
            kubernetes/system/external-ai/overlays/homelab
            kubernetes/system/external-ai/overlays/cloud/in-cluster
            kubernetes/system/external-ai/overlays/cloud/managed
            kubernetes/system/rabbitmq/overlays/homelab
            kubernetes/system/rabbitmq/overlays/cloud
          )
          for overlay in "${overlays[@]}"; do
            output="${RUNNER_TEMP}/$(tr / - <<<"$overlay").yaml"
            kubectl kustomize "$overlay" >"$output"
          done
      - name: Install kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          KUBECONFORM_VERSION: v0.7.0
        run: |
          archive="${RUNNER_TEMP}/kubeconform.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" kubeconform
          chmod 0755 "${RUNNER_TEMP}/kubeconform"
      - name: Offline client-side schema validation
        run: |
          "${RUNNER_TEMP}/kubeconform" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/866b2653a5334db9aed20ad74701e20fd464471b/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -kubernetes-version 1.34.0 \
            -strict \
            -summary \
            "${RUNNER_TEMP}"/kubernetes-system-*.yaml \
            kubernetes/apps/tapy.yaml \
            kubernetes/apps/external-ai.yaml \
            kubernetes/apps/rabbitmq.yaml \
            kubernetes/apps/cloud/in-cluster \
            kubernetes/apps/cloud/managed
