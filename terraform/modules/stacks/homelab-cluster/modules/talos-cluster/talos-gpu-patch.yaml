# ──────────────────────────────────────────────────────────────────────────────
# Talos machine config patch for GPU worker nodes.
#
# The NVIDIA system extensions are part of talos-images/gpu.yaml and are
# resolved by the Image Factory for the configured Talos release. This patch
# activates the modules; Talos 1.13 supplies CDI devices from the toolkit
# extension and the Argo-managed GPU Operator exposes them to Kubernetes.
# ──────────────────────────────────────────────────────────────────────────────

machine:
  # Load kernel modules needed for the GPU at boot.
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset

  # Sysctls sometimes needed for large-memory GPU workloads.
  sysctls:
    vm.nr_hugepages: "1024"
