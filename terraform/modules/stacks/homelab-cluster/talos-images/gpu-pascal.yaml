# Talos Image Factory profile for the Pascal-generation GTX 1060.
#
# NVIDIA open kernel modules support only Turing and newer, and Pascal driver
# support ends with R580. Use the matching proprietary R580 LTS module/toolkit
# pair for gpu-1. The Talos machine patch and Kubernetes GPU role remain the
# same as the RTX nodes.
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/nvidia-container-toolkit-lts
      - siderolabs/nonfree-kmod-nvidia-lts
      - siderolabs/qemu-guest-agent
