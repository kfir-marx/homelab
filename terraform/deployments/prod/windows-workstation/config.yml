---
# VM 502 and Talos GPU worker 402 share largegpu's RTX 3080. Only one may run;
# cp-1 stays resident in either mode:
#   Talos → Windows: qm shutdown 402 && qm start 502
#   Windows → Talos: qm shutdown 502 && qm start 402
#
# VM 502 is a standalone VM on NVMe, with no template or linked-clone parent.
# Native nightly backups are stored on the opposite host's HDD and are the
# disaster-recovery source. Terraform manages the restored VM in standalone
# mode; it does not recreate Windows from a retained template.
windows_vms:
  largegpu-win11:
    proxmox_node: "largegpu"
    vm_id: 502
    machine_type: "pc-q35-10.1"
    datastore_id: "local-lvm"

    # Leaves two of largegpu's 16 hardware threads for cp-1.
    cores: 14
    # Leaves 4 GiB for cp-1 and about 6.7 GiB nominal host headroom.
    memory_mb: 53248
    disk_size_gb: 700

    # Retained for a future deliberate reinstall, but not attached normally.
    attach_install_media: false
    boot_order:
      - scsi0
    iso_datastore_id: "largegpu-hdd"
    windows_iso: "Win11_25H2_EnglishInternational_x64_v2.iso"
    virtio_iso: "virtio-win.iso"

    pci_devices:
      - id: "0000:08:00"
        pcie: true
        xvga: true

    usb_devices:
      - host: "046d:c077" # Logitech USB Optical Mouse
        usb3: false
      - host: "046d:c34b" # Logitech USB Keyboard
        usb3: false
      - host: "1-2" # Novalite controller #1 dongle
        usb3: false
      - host: "5-3" # Novalite controller #2 dongle
        usb3: false
      - host: "33fa:0012" # BARROT Bluetooth adapter
        usb3: false
