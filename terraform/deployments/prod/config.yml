---
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Production environment                                                    ║
# ║                                                                            ║
# ║  1 control plane + 2 GPU workers on the home LAN (192.168.1.0/24).        ║
# ║  All Talos nodes run on the two remaining Proxmox hosts.                  ║
# ║                                                                            ║
# ║  IP convention (matches the rest of the homelab):                          ║
# ║    192.168.1.101–199  → physical machines (Proxmox hosts, etc.)            ║
# ║    192.168.1.200–299  → VMs                                                ║
# ║                                                                            ║
# ║  Putting VMs directly on the home subnet means no static route on the      ║
# ║  router and no IP-forwarding tricks on the Proxmox host. Mac, kubectl,     ║
# ║  talosctl, and any future Proxmox node can reach VMs natively over L2.     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── Cluster settings ─────────────────────────────────────────────────────────
cluster_name: "homelab"
cluster_endpoint: "https://192.168.1.210:6443"
cluster_vip: "192.168.1.210"

# ── Network ──────────────────────────────────────────────────────────────────
network_gateway: "192.168.1.1"
# Reserved for Cilium LB IPAM. This range is outside the addresses used by the
# Kubernetes API and Talos nodes and was explicitly approved for homelab use.
cilium_load_balancer_ip_start: "192.168.1.220"
cilium_load_balancer_ip_stop: "192.168.1.229"

# ── ArgoCD ───────────────────────────────────────────────────────────────────
argocd_target_revision: "main"

# ── Control-plane nodes ───────────────────────────────────────────────────────
# The single control plane lives on the more reliable largegpu host. Terraform
# migrates the existing VM in place so its single-member etcd data is retained.
# This favors smallgpu failure tolerance and frees RAM for its application worker.
control_plane_nodes:
  cp-1:
    proxmox_node: "largegpu"
    vm_id: 201
    ip_address: "192.168.1.211/24"
    cores: 2
    memory_mb: 4096
    disk_size_gb: 50

# ── General workers ───────────────────────────────────────────────────────────
# None: gpu-3 is a mixed general+GPU worker in one VM. NFS runs on the Proxmox
# hosts and does not require a colocated general Kubernetes worker.
worker_nodes: {}

# ── Proxmox GPU nodes (PCIe passthrough) ────────────────────────────────────
gpu_nodes:
  # largegpu: Ryzen 7 5800X (8c/16t), 62.7 GiB RAM, RTX 3080 at 08:00.
  # The Talos GPU VM and Windows VM are each capped at 14 vCPU / 52 GiB so
  # cp-1 can remain resident. The GPU VMs remain mutually exclusive because both
  # pass through the RTX 3080. Stop 402 before 502.
  gpu-2:
    proxmox_node: "largegpu"
    vm_id: 402
    ip_address: "192.168.1.232/24"
    cores: 14
    memory_mb: 53248
    disk_size_gb: 159
    # Keep this disposable worker's system and scratch disks off local-lvm.
    # Windows and cp-1 otherwise exhaust that NVMe thin pool when the linked
    # Windows clone approaches its declared 635 GiB size.
    system_disk_datastore_id: "largegpu-hdd"
    system_disk_file_format: "qcow2"
    # The 400 GiB scratch cap protects the higher-priority Proxmox backup reserve.
    scratch_disk:
      datastore_id: "largegpu-hdd"
      size_gb: 400
      serial: "gpu2-scratch"
    pci_devices:
      - id: "08:00"
        pcie: true

  # smallgpu: RTX 2060 at 09:00; GPU, audio, USB, and UCSI functions share
  # IOMMU group 18 and are passed through together. This VM reserves 12 GiB,
  # leaving ~3.5 GiB for Proxmox, QEMU overhead, and bulk NFS.
  # Unlike gpu-2, this node is not tainted: it also runs ordinary pods.
  # Host prerequisite verified 2026-07-22: PCI IDs 10de:1e89, 10de:10f8,
  # 10de:1ad8, and 10de:1ad9 bind to vfio-pci and /dev/vfio/18 exists.
  gpu-3:
    proxmox_node: "smallgpu"
    vm_id: 403
    ip_address: "192.168.1.233/24"
    cores: 10
    memory_mb: 12288
    disk_size_gb: 100
    dedicated: false
    # Live SQLite/config state for the media stack. This stays local because
    # the Servarr applications do not support their databases on NFS; an
    # encrypted scheduled backup lands on the permanent critical NFS tier.
    state_disk:
      datastore_id: "local-lvm"
      size_gb: 50
      serial: "media-state"
    pci_devices:
      - id: "09:00"
        pcie: true
